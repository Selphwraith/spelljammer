// ── Cargo / Inventory (mirrors buildInvGrid from index.html) ──────────────────
let _surfInvFilter = 'all';
let _surfSelItem   = null;

function surfSetFilter(f, btn) {
  _surfInvFilter = f;
  document.querySelectorAll('#surf-inv-filters .fbtn').forEach(b => b.classList.remove('act'));
  if (btn) btn.classList.add('act');
  surfBuildInvGrid();
}

function surfBuildInvGrid() {
  const grid   = document.getElementById('surf-inv-grid');   if (!grid) return;
  const empty  = document.getElementById('surf-inv-empty');
  const footer = document.getElementById('surf-inv-footer');
  const detail = document.getElementById('surf-inv-detail');
  if (detail) { detail.style.display = 'none'; _surfSelItem = null; }
  grid.innerHTML = '';
  const inv = S.captain.inv.filter(item => {
    if (_surfInvFilter === 'all') return true;
    return _surfItemDef(item).type === _surfInvFilter;
  });
  if (!inv.length) {
    if (empty) empty.style.display = 'block';
    grid.style.display = 'none';
  } else {
    if (empty) empty.style.display = 'none';
    grid.style.display = 'grid';
    inv.forEach(item => {
      const def = _surfItemDef(item);
      const qty = item.qty || 1;
      const d = document.createElement('div');
      d.className = 'inv-item';
      d.setAttribute('data-sid', item.id || Math.random());
      d.innerHTML = '<div class="inv-ico">' + def.ico + '</div>'
        + '<div class="inv-iname">' + def.n + (qty > 1 ? ' \xd7' + qty : '') + '</div>';
      d.onclick = () => _surfSelectItem(item);
      grid.appendChild(d);
    });
  }
  const total = S.captain.inv.reduce((a, item) => a + (_surfItemDef(item).val || 0) * (item.qty || 1), 0);
  if (footer) footer.textContent = S.captain.inv.length + ' items \u2014 Est. sell value: ' + total + ' TS';
}

function _surfSelectItem(item) {
  _surfSelItem = item;
  document.querySelectorAll('.inv-item').forEach(el => el.classList.remove('sel'));
  event?.currentTarget?.classList.add('sel');
  const def    = _surfItemDef(item);
  const detail = document.getElementById('surf-inv-detail'); if (!detail) return;
  detail.style.display = 'block';
  document.getElementById('surf-inv-d-ico').textContent  = def.ico;
  document.getElementById('surf-inv-d-name').textContent = def.n + (item.qty > 1 ? ' \xd7' + item.qty : '');
  document.getElementById('surf-inv-d-desc').textContent = def.desc;
  document.getElementById('surf-inv-d-val').textContent  = def.val;
  const acts = document.getElementById('surf-inv-d-actions'); acts.innerHTML = '';

  // Use / Install button
  if (def.use) {
    const ub = document.createElement('button'); ub.className = 'btn gd sm';
    if (def.shipOnly) {
      ub.disabled = true;
      ub.style.opacity = '0.38';
      ub.textContent = (def.type === 'equip' ? '\ud83d\udd29 Install' : '\u2728 Use') + ' (Ship only)';
      ub.title = 'Return to your vessel to use this item';
    } else if (def.use === 'heal20' || def.heal || def.healFull) {
      ub.textContent = '✨ Use';
      ub.disabled = S.captain.hp >= S.captain.maxHp;
      if (ub.disabled) { ub.style.opacity='0.38'; ub.title='Already at full HP'; }
      ub.onclick = () => {
        if (S.captain.hp >= S.captain.maxHp) { setStatus('Already at full HP.'); return; }
        const healAmt = def.healFull ? S.captain.maxHp : (def.heal || 20);
        Captain.healHP(S.captain, healAmt);
        item.qty = (item.qty||1) - 1;
        if (item.qty <= 0) S.captain.inv = S.captain.inv.filter(i => i !== item);
        saveCaptain(S.captain);
        sfx('purchase', 0.5);
        setStatus('Used ' + (def.name||def.n) + '. HP: ' + S.captain.hp + '/' + S.captain.maxHp);
        surfBuildInvGrid();
      };
    } else if (def.regen) {
      ub.textContent = '✨ Apply (Regen)';
      ub.disabled = (S.captain.regenRounds||0) > 0;
      if (ub.disabled) { ub.style.opacity='0.38'; ub.title='Regen already active'; }
      ub.onclick = () => {
        S.captain.regenRounds   = def.regenTurns || 5;
        S.captain.regenPerRound = def.regen || 5;
        item.qty = (item.qty||1) - 1;
        if (item.qty <= 0) S.captain.inv = S.captain.inv.filter(i => i !== item);
        saveCaptain(S.captain);
        sfx('purchase', 0.5);
        setStatus('Blessed Salve active — +' + (def.regen||5) + ' HP/turn for ' + (def.regenTurns||5) + ' turns.');
        surfBuildInvGrid();
      };
    } else if (def.use === 'reload') {
      const maxShots = S.captain.ranged?.shotsPerCombat || 3;
      const loaded   = S.captain.shotsLoaded ?? 0;
      ub.textContent = '\u21ba Reload Pistol';
      ub.disabled = loaded >= maxShots;
      if (ub.disabled) { ub.style.opacity='0.38'; ub.title='Pistol already fully loaded'; }
      ub.onclick = () => {
        item.qty = (item.qty||1) - 1;
        if (item.qty <= 0) S.captain.inv = S.captain.inv.filter(i => i !== item);
        S.captain.shotsLoaded = maxShots;
        sfx('reload', 0.8);
        setStatus('Reloaded \u2014 ' + maxShots + ' shots ready.');
        surfBuildInvGrid();
      };
    }
    acts.appendChild(ub);
  }

  // Sell button
  if (def.val > 0) {
    const shopIsOpen = document.getElementById('surf-shop')?.style.display === 'flex';
    const sb = document.createElement('button'); sb.className = 'btn sm';
    sb.textContent = '\ud83d\udcb0 Sell (' + def.val + ' TS ea)';
    if (!shopIsOpen || !_shopNpc) {
      sb.disabled = true; sb.style.opacity = '0.45';
      sb.title = 'Talk to Mira Voss or Jorek Vane to sell';
    } else {
      sb.onclick = () => {
        const mult  = (SHOP_STOCK[_shopNpc?.shopId]?.sellMult || 1);
        const price = Math.floor(def.val * mult);
        item.qty = (item.qty||1) - 1;
        if (item.qty <= 0) S.captain.inv = S.captain.inv.filter(i => i !== item);
        S.gold += price;
        sfx('sell', 0.7);
        setStatus('Sold ' + def.n + ' for ' + price + ' TS.');
        surfBuildInvGrid(); _buildShopList();
      };
    }
    acts.appendChild(sb);
  }
}

// ── Save / Load (mirrors index.html exactly) ─────────────────────────
const _SURF_SAVE_KEY = 'fentheris_saves';

function _surfGetSaves() {
  try { return JSON.parse(localStorage.getItem(_SURF_SAVE_KEY))||[null,null,null]; } catch(_) { return [null,null,null]; }
}
function _surfGetAuto() {
  try { return JSON.parse(localStorage.getItem('fentheris_autosave'))||null; } catch(_) { return null; }
}
function _surfSlotHTML(save, slotId, isAuto) {
  const canSave = !isAuto && !!S._indexEntry;
  if (save) {
    const date   = new Date(save.timestamp).toLocaleString();
    const isSurf = save.context === 'surface';
    const ctx    = isSurf ? ' [Surface]' : ' [Space]';
    const name   = save.name || (isAuto ? 'Auto Save' : 'Slot '+(slotId+1));
    const detail = isSurf
      ? 'Day '+(save.day||'?')+' | '+(save.TS||save.gold||0)+' TS | '+(save.loc||'Surface')
      : (save.shipName||'')+' | '+(save.loc||'')+' | '+(save.TS||save.gold||0)+' TS';
    const lb = '<button class="ssbtn gd" data-slot="'+slotId+'" data-act="load">Load</button>';
    const ob = (!isAuto&&canSave)?'<button class="ssbtn" data-slot="'+slotId+'" data-act="save">Overwrite</button>':''; 
    const db = !isAuto?'<button class="ssbtn dmg" data-slot="'+slotId+'" data-act="del">Delete</button>':''; 
    return '<div class="save-slot"><div class="save-info">'
      +'<div class="save-name">'+(isAuto?'&#128260;':'&#128190;')+' '+name+ctx+'</div>'
      +'<div class="save-detail">'+detail+'</div>'
      +'<div class="save-detail" style="color:#332211;">'+date+'</div>'
      +'</div><div class="save-actions">'+lb+ob+db+'</div></div>';
  }
  const sb = canSave?'<button class="ssbtn" data-slot="'+slotId+'" data-act="save">Save Here</button>':'';
  return '<div class="save-slot empty"><div class="save-info"><div class="save-name" style="color:#554433;">— Empty Slot '+(isAuto?'':slotId+1)+' —</div></div><div class="save-actions">'+sb+'</div></div>';
}
function _surfBuildSaveSlots() {
  const ae = document.getElementById('surf-autosave-slot');
  if (ae) ae.innerHTML = _surfSlotHTML(_surfGetAuto(),'auto',true);
  const list = document.getElementById('surf-save-slots-list'); if (!list) return;
  list.innerHTML = '';
  _surfGetSaves().forEach((save,i)=>{ const d=document.createElement('div'); d.innerHTML=_surfSlotHTML(save,i,false); list.appendChild(d.firstElementChild||d); });
  // Event delegation — handles all ssbtn clicks via data-slot / data-act
  const body = document.getElementById('surf-ovl-save');
  if (body && !body._delegated) {
    body._delegated = true;
    body.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const slot = btn.dataset.slot, act = btn.dataset.act;
      if (act==='load') _surfLoadSlot(slot==='auto'?'auto':parseInt(slot));
      else if (act==='save') _surfPromptSave(parseInt(slot));
      else if (act==='del')  _surfDeleteSlot(parseInt(slot));
    });
  }
}
function _surfBuildSave(label) {
  // Surface state snapshot — works with or without _indexEntry
  const ie = S._indexEntry || {};
  const ss = {
    px: S.px, py: S.py,
    day: S.day, nfRespawnDay: S.nfRespawnDay, nfQuestTier: S.nfQuestTier, gold: S.gold,
    enemies: S.enemies.map(e => ({ alive:e.alive, currentHp:e.currentHp, tx:e.tx, ty:e.ty, type:e.type })),
  };
  // Package in index.html's save format so slots are cross-compatible
  const state = {
    ship:      Object.assign({}, ie.ship || {}, { gold: S.gold, inv: S.captain.inv }),
    spheres:   ie.spheres   || [],
    frags:     ie.frags     || 0,
    clues:     ie.clues     || [],
    fragsCollected:     ie.fragsCollected     || [],
    localQuests:        ie.localQuests        || {},
    lsQmStock:          ie.lsQmStock          || null,
    lsLastSpawn:        ie.lsLastSpawn        || {},
    lsLastVisit:        ie.lsLastVisit        || {},
    lsState:            { inLocalSpace: false },
    rep:                ie.rep                || {},
    quests:             ie.quests             || [],
    completedQuests:    ie.completedQuests    || [],
    postVictory:        ie.postVictory        || false,
    breachEntered:      ie.breachEntered      || false,
    worldBossDefeated:  ie.worldBossDefeated  || [],
    breachIntel:        ie.breachIntel        || [],
    wbDiscovered:       ie.wbDiscovered       || [],
    wbPatrol:           ie.wbPatrol           || {},
    shothothuqUnlocked: ie.shothothuqUnlocked || false,
    farPhlo:            ie.farPhlo            || null,
    _breachArrived:     ie._breachArrived     || {},
    captainLog:         ie.captainLog         || [],
    travelDays:         ie.travelDays         || 0,
    watch:     ie.watch  || { day: S.day, totalHours: S.totalHours, hoursAwake: S.hoursAwake },
    journeyOrigWatches: ie.journeyOrigWatches || 0,
    journeyWpHit:       ie.journeyWpHit       || false,
    tutorial:           ie.tutorial           || null,
    lsOrbitHours:       ie.lsOrbitHours       || 0,
    captain:   S.captain,
    surfaceState: ss,
  };
  const ship = state.ship || {};
  return {
    context:   'surface',
    name:      label,
    timestamp: Date.now(),
    shipName:  ship.name  || 'Unknown',
    shipType:  ship.type  || '',
    hull:      ship.hull  || 0,
    maxHull:   ship.maxHull || 0,
    crew:      ship.crew  || 0,
    TS:        S.gold,
    gold:      S.gold,
    day:       S.day,
    frags:     state.frags,
    loc:       'Surface — Fentheris',
    data:      JSON.stringify(state),
  };
}

function _surfApplySave(save) {
  if (!save) return false;
  try {
    // Extract surfaceState — try data field first, then top-level
    let ss = null;
    if (save.data) {
      try { const d = JSON.parse(save.data); ss = d.surfaceState || null; } catch(_) {}
    }
    if (!ss) ss = save.surfaceState || null;
    if (!ss) return false;
    if (ss.px)         S.px   = ss.px;
    if (ss.py)         S.py   = ss.py;
    if (ss.day)        S.day         = ss.day;
    if (ss.nfRespawnDay)  S.nfRespawnDay  = ss.nfRespawnDay;
    if (ss.nfQuestTier != null) S.nfQuestTier = ss.nfQuestTier;
    if (ss.gold != null) S.gold = ss.gold;
    // Restore captain
    let cap = null;
    if (save.data) { try { cap = JSON.parse(save.data).captain; } catch(_) {} }
    if (!cap) cap = save.captain || null;
    if (cap) {
      S.captain = Object.assign({}, S.captain, cap);
      ['melee','ranged','armor','helmet','inv'].forEach(k => { if (cap[k]) S.captain[k] = cap[k]; });
      // Persist restored captain to localStorage so loadCaptain() is consistent
      saveCaptain(S.captain);
    }
    // Restore enemy alive/hp
    if (ss.enemies && ss.enemies.length === S.enemies.length) {
      ss.enemies.forEach((se, i) => {
        if (S.enemies[i]) { S.enemies[i].alive = se.alive; S.enemies[i].currentHp = se.currentHp; }
      });
    }
    // Refresh _indexEntry if save has full data
    if (save.data) {
      try {
        const d = JSON.parse(save.data);
        S._indexEntry = Object.assign({}, S._indexEntry || {}, d, { ship: Object.assign({}, d.ship, { gold: S.gold }) });
      } catch(_) {}
    }
    updateHUD();
    setStatus('Save loaded. Day ' + S.day + '. HP ' + S.captain.hp + '/' + S.captain.maxHp + '.');
    return true;
  } catch(e) { return false; }
}

function _surfPromptSave(slot) {
  const saves=_surfGetSaves(), def=saves[slot]?.name||'Surface — Day '+S.day;
  const name=prompt('Name this save:',def); if (name===null) return;
  const save=_surfBuildSave(name.trim()||def); saves[slot]=save;
  try { localStorage.setItem(_SURF_SAVE_KEY,JSON.stringify(saves)); } catch(_) {}
  saveCaptain(S.captain);  // keep captain.js in sync with manual save
  sfx('purchase',0.5); setStatus('Saved to Slot '+(slot+1)+'.'); _surfBuildSaveSlots();
}
function _surfLoadSlot(slot) {
  const save=slot==='auto'?_surfGetAuto():_surfGetSaves()[slot]; if (!save) return;
  if (save.context==='surface') { _surfApplySave(save); surfCloseOvl('save'); }
  else if (confirm('Space save. Return to ship to load it?')) {
    sessionStorage.setItem('fentheris_surface_return','1'); window.location.href='index.html';
  }
}
function _surfDeleteSlot(slot) {
  if (!confirm('Delete Slot '+(slot+1)+'?')) return;
  const saves=_surfGetSaves(); saves[slot]=null;
  try { localStorage.setItem(_SURF_SAVE_KEY,JSON.stringify(saves)); } catch(_) {}
  _surfBuildSaveSlots();
}
function surfAutoSave() {
  if (!S._indexEntry && !S.captain.gearGiven) return;
  try { localStorage.setItem(SURF_AUTO_KEY,JSON.stringify(_surfBuildSave('Auto'))); } catch(_) {}
  // Keep captain.js localStorage in sync with every autosave
  saveCaptain(S.captain);
}

function _drawMinimap() {
  const cv = document.getElementById('surf-minimap');
  if (!cv || _mmMinimized) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const R = W / 2;
  // Clip to circle
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.beginPath(); ctx.arc(R,R,R-1,0,Math.PI*2); ctx.clip();
  // Tile scale: fit entire map into minimap canvas
  const tW = W / MAP_W, tH = H / MAP_H;
  // Tile colours
  const TILE_COL = {
    0:'#142008', 1:'#1a1206', 2:'#1a1a12', 3:'#0a1804',
    4:'#0a0808', 5:'#0a0808', 8:'#282214', 9:'#1a1208',
    10:'#2a1c0a', 15:'#0a0808',
    16:'#2a1a06', 17:'#2a1a06', 18:'#2a1a06',
    19:'#2a1a06', 20:'#2a1a06', 21:'#2a1a06', 22:'#2a1a06',
    23:'#3a2008', 24:'#c8b060',
  };
  for (let ty=0; ty<MAP_H; ty++) {
    for (let tx=0; tx<MAP_W; tx++) {
      const t = MAP_TILES[ty*MAP_W+tx] ?? 0;
      ctx.fillStyle = TILE_COL[t] || '#0a0a08';
      ctx.fillRect(tx*tW, ty*tH, Math.ceil(tW), Math.ceil(tH));
    }
  }
  // Enemies
  S.enemies.forEach(e => {
    if (!e.alive) return;
    ctx.fillStyle = '#cc3333';
    ctx.beginPath(); ctx.arc(e.tx*tW+tW/2, e.ty*tH+tH/2, Math.max(1.5,tW*0.6), 0, Math.PI*2);
    ctx.fill();
  });
  // NPCs
  NPCS.forEach(n => {
    ctx.fillStyle = '#44aaff';
    ctx.beginPath(); ctx.arc(n.tx*tW+tW/2, n.ty*tH+tH/2, Math.max(1.2,tW*0.5), 0, Math.PI*2);
    ctx.fill();
  });
  // Player
  const px = (S.px/TILE_SIZE)*tW, py = (S.py/TILE_SIZE)*tH;
  ctx.fillStyle = '#ffee44';
  ctx.beginPath(); ctx.arc(px, py, Math.max(2, tW*0.75), 0, Math.PI*2);
  ctx.fill();
  // Border
  ctx.restore();
  ctx.strokeStyle = 'rgba(180,140,60,0.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(R,R,R-1,0,Math.PI*2); ctx.stroke();
}

// ── Sister Vael — chapel patrol ───────────────────────────────────────────────
// Waypoints: altar, circumference of chapel, centre aisle, with pause durations.
// Altar pauses are longer. All coordinates in TILE units.
// Chapel interior: tx 20-27, ty 1-12. Door at ty 13.
const VAEL_WAYPOINTS = [
  { tx:23, ty:2,  pause:4.0, dir:'down'  },  // altar centre — long prayer pause
  { tx:20, ty:2,  pause:0.5, dir:'right' },  // altar left side
  { tx:20, ty:5,  pause:0.8, dir:'down'  },  // left column top
  { tx:20, ty:8,  pause:0.3, dir:'down'  },  // left column mid
  { tx:20, ty:11, pause:0.5, dir:'right' },  // left column bottom
  { tx:23, ty:12, pause:0.4, dir:'up'    },  // entrance — checks on patients
  { tx:27, ty:11, pause:0.5, dir:'left'  },  // right column bottom
  { tx:27, ty:8,  pause:0.3, dir:'up'    },  // right column mid
  { tx:27, ty:5,  pause:0.8, dir:'up'    },  // right column top
  { tx:27, ty:2,  pause:0.5, dir:'left'  },  // altar right side
  { tx:24, ty:2,  pause:3.5, dir:'down'  },  // back to altar — second prayer
  { tx:23, ty:6,  pause:1.2, dir:'down'  },  // centre aisle mid — moment of reflection
  { tx:23, ty:10, pause:0.6, dir:'down'  },  // centre aisle front
  { tx:23, ty:12, pause:0.8, dir:'up'    },  // entrance again
  { tx:23, ty:8,  pause:0.4, dir:'up'    },  // centre aisle — heading back
  { tx:23, ty:4,  pause:0.5, dir:'up'    },  // near altar
];

const _vael = {
  wpIdx:    0,       // current waypoint index
  pauseT:   2.0,     // start with a pause (she's praying)
  moving:   false,
  px:       23 * 32, // pixel position
  py:       2  * 32,
  dir:      'down',
  animT:    0,
  animFrame:0,
};

function _updateVael(dt) {
  if (S.combat.active) return; // freeze during combat
  _vael.animT += dt;
  if (_vael.animT > 0.15) { _vael.animT = 0; _vael.animFrame = (_vael.animFrame+1) % 4; }

  const wp = VAEL_WAYPOINTS[_vael.wpIdx];

  if (_vael.pauseT > 0) {
    _vael.moving  = false;
    _vael.dir     = wp.dir;
    _vael.pauseT -= dt;
    if (_vael.pauseT <= 0) {
      // Advance to next waypoint
      _vael.wpIdx = (_vael.wpIdx + 1) % VAEL_WAYPOINTS.length;
    }
    return;
  }

  // Move toward current waypoint in pixel space
  const NPC_SPEED = 1.2; // tiles per second — slower than player (5)
  const targetPx  = wp.tx * TILE_SIZE;
  const targetPy  = wp.ty * TILE_SIZE;
  const dx = targetPx - _vael.px;
  const dy = targetPy - _vael.py;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist < 2) {
    // Arrived
    _vael.px     = targetPx;
    _vael.py     = targetPy;
    _vael.moving = false;
    _vael.pauseT = wp.pause;
    _vael.dir    = wp.dir;
  } else {
    _vael.moving = true;
    const step   = NPC_SPEED * TILE_SIZE * dt;
    _vael.px    += (dx/dist) * step;
    _vael.py    += (dy/dist) * step;
    // Set direction from movement
    if (Math.abs(dx) > Math.abs(dy)) {
      _vael.dir = dx > 0 ? 'right' : 'left';
    } else {
      _vael.dir = dy > 0 ? 'down' : 'up';
    }
  }

  // Keep NPC position synced to NPCS array so interaction still works
  const npc = NPCS.find(n => n.id === 'cleric_1');
  if (npc) {
    npc.tx = Math.round(_vael.px / TILE_SIZE);
    npc.ty = Math.round(_vael.py / TILE_SIZE);
  }
}

function _drawVael(ctx, camOffX, camOffY) {
  const img = IMGS['surface/npc_vael.png'];
  const sx  = Math.round(_vael.px + camOffX);
  const sy  = Math.round(_vael.py + camOffY);

  if (img?.complete && img.naturalWidth > 0) {
    const DIR_ROW_NPC = { down:0, left:1, right:2, up:3 };
    const row = DIR_ROW_NPC[_vael.dir] || 0;
    const col = _vael.moving ? _vael.animFrame : 0;
    ctx.drawImage(img,
      col * FRAME_W, row * FRAME_H, FRAME_W, FRAME_H,
      sx, sy, FRAME_W, FRAME_H);
  } else {
    // Fallback: coloured rect
    ctx.fillStyle = '#4466aa';
    ctx.fillRect(sx+6, sy+2, 20, 28);
    ctx.fillStyle = '#aa8855';
    ctx.fillRect(sx+10, sy+2, 12, 10);
  }
}

// Draw ship in dock — procedural pixel art based on G.ship.type from index entry
function _drawShipInDock(ctx, ox, oy) {
  // Ship type from entry — flat field 'shipType' sent by descendToSurface
  const shipType = S._indexEntry?.shipType || S._indexEntry?.ship?.type || 'pinnace';
  const shipName = S._indexEntry?.shipName || S._indexEntry?.ship?.name || 'Your Vessel';

  // Draw area: 9 tiles wide × 5 tiles tall, centred in the dock
  const DW = 9 * TILE_SIZE, DH = 5 * TILE_SIZE;

  // Water background
  ctx.fillStyle = 'rgba(15,40,90,0.88)';
  ctx.fillRect(ox, oy, DW, DH);
  // Shimmer lines
  ctx.strokeStyle = 'rgba(50,120,200,0.25)'; ctx.lineWidth = 1;
  for (let w=0; w<5; w++) {
    ctx.beginPath();
    ctx.moveTo(ox+4, oy+8+w*14);
    ctx.lineTo(ox+DW-4, oy+8+w*14);
    ctx.stroke();
  }
  // Pier planks at bottom
  ctx.fillStyle='#5a4a30'; ctx.fillRect(ox, oy+DH-8, DW, 8);
  ctx.fillStyle='#4a3a20';
  for (let x=0; x<DW; x+=14) ctx.fillRect(ox+x, oy+DH-8, 2, 8);

  // ── Try PNG first ──────────────────────────────────────────────────────────
  const imgW = Math.floor(DW * 0.82), imgH = Math.floor(DH * 0.80);
  const imgX = ox + (DW-imgW)/2, imgY = oy + (DH-imgH)/2 - 6;

  if (_dockShipImg && _dockShipImg.complete && _dockShipImg.naturalWidth > 0) {
    ctx.save();
    ctx.globalAlpha = 0.96;
    ctx.drawImage(_dockShipImg, imgX, imgY, imgW, imgH);
    ctx.restore();
  } else {
    // ── Procedural fallback (coloured by ship type) ────────────────────────
    const hullCols = {
      pinnace:['#4a5a8a','#6a7aaa','#3a4a7a'], squid:['#2a5a5a','#4a8a8a','#1a4a4a'],
      hammer:['#6a4a2a','#9a7a4a','#4a3a1a'],  manow:['#3a3a6a','#5a5a9a','#2a2a5a'],
      corsair:['#5a2a2a','#8a4a4a','#4a1a1a'],  plunderer:['#4a3a6a','#7a6a9a','#3a2a5a'],
      blackfleet:['#1a1a2a','#3a3a4a','#0a0a1a'],
    };
    const [hull,hl,shd] = hullCols[shipType] || hullCols.pinnace;
    ctx.fillStyle=hull; ctx.fillRect(imgX+8,imgY+10,imgW-16,imgH-16);
    ctx.fillStyle=hl;   ctx.fillRect(imgX+12,imgY+14,imgW-24,10);
    ctx.fillStyle=shd;  ctx.fillRect(imgX+10,imgY+imgH-18,imgW-20,8);
    ctx.fillStyle=hull;
    ctx.beginPath();
    ctx.moveTo(imgX+imgW/2,imgY+4);
    ctx.lineTo(imgX+12,imgY+14);
    ctx.lineTo(imgX+imgW-12,imgY+14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#8a6a30'; ctx.fillRect(imgX+imgW/2-2,imgY+6,4,imgH-18);
    ctx.fillStyle='rgba(220,210,180,0.85)'; ctx.fillRect(imgX+imgW/2-16,imgY+8,32,18);
  }

  // Ship name label
  ctx.fillStyle='rgba(200,220,255,0.92)'; ctx.font='bold 11px Courier New';
  ctx.textAlign='center';
  ctx.fillText(shipName, ox+DW/2, oy+DH+13);
  ctx.textAlign='left';
}

function _getHuntTarget() {
  // Rotate through types, scaling up
  if(!S.quest)S.quest={active:false,target:0,killed:0,type:'crawler',label:'',reward:0,rewarded:false,completions:0};
  const idx=(S.quest.completions||0)%HUNT_TARGETS.length;
  return HUNT_TARGETS[idx];
}

function openQuestDialogue(npc) {
  const q = S.quest;
  const target = _getHuntTarget();
  const isRepeat = (q.completions||0) > 0;

  // ── No active quest: offer one ──────────────────────────────────────
  if (!q.active) {
    const wasReset = (S.nfQuestTier === 0 && (q.completions||0) > 0 && !q._shownDefeatLine);
    const offerText = wasReset
      ? (HUNT_TARGETS[0].defeatLine || HUNT_TARGETS[0].offerLine)
      : isRepeat ? target.repeatLine : target.offerLine;
    if (wasReset) q._shownDefeatLine = true;
    _showQuestLine(npc, offerText);
    // Activate quest after dialogue is shown
    q.active   = true;
    q.type     = target.type;
    q.target   = target.count;
    q.killed   = 0;
    q.label    = target.label;
    q.reward   = target.reward;
    q.rewarded = false;
    setStatus('Quest: Hunt ' + target.count + ' ' + target.label + ' in the Northern Field.');
    return;
  }

  // ── Quest active, not yet complete: show progress ──────────────────
  if (q.active && q.killed < q.target) {
    const rem = q.target - q.killed;
    _showQuestLine(npc,
      'You still have work to do. ' + q.killed + ' down, ' + rem + ' ' + q.label +
      ' left to kill. Head north through the field.');
    setStatus('Hunt: ' + q.killed + '/' + q.target + ' ' + q.label);
    return;
  }

  // ── Quest complete: turn in ─────────────────────────────────────────
  if (q.active && q.killed >= q.target) {
    q.active      = false;
    q.rewarded    = false;
    q.completions = (q.completions||0) + 1;
    S.gold       += q.reward;
    sfx('level_up', 0.9);
    // Advance to next enemy tier (crawlers→lurkers→watchers, then stop)
    const nextTier = (S.nfQuestTier||0) + 1;
    if (nextTier < 3) S.nfQuestTier = nextTier;
    _showQuestLine(npc, target.returnLine + ' (+' + q.reward + ' TS)');
    setStatus('Quest complete! +' + q.reward + ' TS earned.');
    q.killed = 0;
    return;
  }
}

// Show a single custom line in the NPC dialogue box (overrides npc.lines temporarily)
function _showQuestLine(npc, text) {
  // Inject text into the real dialogue system
  const savedLines = npc.lines;
  npc.lines = [text];
  openDlg(npc);
  npc.lines = savedLines;  // restore immediately after
}

// Hook into tryInteract to intercept quest giver
const _origTryInteract = tryInteract;
function tryInteract() {
  const tx = Math.floor(S.px/TILE_SIZE), ty = Math.floor(S.py/TILE_SIZE);
  const fdx = S.dir==='left'?-1:S.dir==='right'?1:0;
  const fdy = S.dir==='up' ?-1:S.dir==='down' ?1:0;
  const cands=[[tx+fdx,ty+fdy],[tx,ty-1],[tx,ty+1],[tx-1,ty],[tx+1,ty]];
  for (const [cx,cy] of cands) {
    const npc = NPCS.find(n=>n.tx===cx&&n.ty===cy);
    if (npc) {
      sfx('npc_interact', 0.55);
      if (npc.isQuestGiver) { openQuestDialogue(npc); }
      else { openDlg(npc); }  // merchants show Trade button inside dialogue
      S.interactCooldown = 30;
      return;
    }
  }
}

// Track kills for quest
function _questTrackKill(enemyType) {
  const q = S.quest;
  if (!q.active || q.killed >= q.target) return;
  if (enemyType === q.type) {
    q.killed++;
    if (q.killed >= q.target) {
      setStatus('Quest complete! Return to Warden Tessick for your reward. (' + q.killed + '/' + q.target + ')');
      sfx('level_up', 0.7);
    } else {
      setStatus('Hunt: ' + q.killed + '/' + q.target + ' ' + q.label + ' — ' + (q.target-q.killed) + ' remaining.');
    }
  }
}

const NF_W = 48, NF_H = 20;
const NF_TILE = 32;

// Northern Field map — grassland / sparse forest
// 0=grass 3=tall-grass 4=tree-top 5=tree-bot 15=cliff(south boundary)
const NF_TILES = (() => {
  // Use a proper pseudo-random hash to avoid column artifacts
  const hash = (x, y) => {
    let h = (x * 374761393 + y * 1103515245 + 12345) & 0x7fffffff;
    h = ((h >> 16) ^ h) * 0x45d9f3b & 0x7fffffff;
    return h % 100;
  };
  const t = [];
  for (let y = 0; y < NF_H; y++) {
    for (let x = 0; x < NF_W; x++) {
      // Cliff at south edge
      if (y >= NF_H - 2) { t.push(15); continue; }
      // Single border column each side
      if (x === 0 || x === NF_W - 1) { t.push(y % 2 === 0 ? 4 : 5); continue; }
      const h = hash(x, y);
      const hN = y > 0 ? hash(x, y-1) : 100;
      // Tree top: ~12% of tiles, never adjacent columns (check neighbours)
      const leftH  = x > 1 ? hash(x-1, y) : 100;
      const rightH = x < NF_W-2 ? hash(x+1, y) : 100;
      if (h < 12 && leftH >= 12 && rightH >= 12) { t.push(4); continue; }
      // Tree bottom: only directly below a tree top
      if (t.length > 0 && t[(y-1)*NF_W + x] === 4 && y > 0) { t.push(5); continue; }
      // Tall grass patches: ~15%
      if (h >= 70 && h < 85) { t.push(3); continue; }
      t.push(0);
    }
  }
  return t;
})();

// ── Northern Field enemy patrol + vision AI ──────────────────────────────────
const NF_PATROL_RADIUS = 5;   // tiles from home before turning back
const NF_VISION_RANGE  = 6;   // tiles distance for cone detection
const NF_VISION_ARC    = 0.7; // radians half-arc (~40°) — narrow but meaningful
const NF_CHASE_SPEED   = 0.6; // tiles per second (slower than player 1.2)

function _nfVisionCone(e) {
  // Returns true if the player is inside this enemy's vision cone
  const ptx = NF.px / NF_TILE;
  const pty = NF.py / NF_TILE;
  const dx  = ptx - e.tx;
  const dy  = pty - e.ty;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > NF_VISION_RANGE) return false;

  // Enemy facing angle
  const faceAng = { up:-Math.PI/2, down:Math.PI/2, left:Math.PI, right:0 }[e.facingDir] || 0;
  const toPlayerAng = Math.atan2(dy, dx);
  let diff = Math.abs(toPlayerAng - faceAng);
  if (diff > Math.PI) diff = 2*Math.PI - diff;
  return diff <= NF_VISION_ARC;
}

function _nfUpdateEnemies(dt) {
  const ptx = NF.px / NF_TILE;
  const pty = NF.py / NF_TILE;
  const DIRS = ['up','right','down','left'];

  for (const e of NF.enemies) {
    if (!e.alive) continue;

    // Cooldown tick
    if (e.alertCooldown > 0) e.alertCooldown -= dt;

    // Vision check — become alerted if player enters cone
    if (!e.alerted && e.alertCooldown <= 0) {
      if (_nfVisionCone(e)) {
        e.alerted = true;
        // Brief pause before charging
        e.alertCooldown = 0.4;
        continue;
      }
    }

    // ── Alerted: move toward player ──────────────────────────────────────
    if (e.alerted) {
      // Re-check: if player is dead or out of a larger "give up" range, de-alert
      const chaseDist = Math.abs(ptx-e.tx) + Math.abs(pty-e.ty);
      if (chaseDist > NF_VISION_RANGE * 2.5) {
        e.alerted = false; e.alertCooldown = 1.0; continue;
      }

      // Step toward player
      e.patrolT += dt;
      if (e.patrolT >= 1.0 / NF_CHASE_SPEED) {
        e.patrolT = 0;
        const ddx = ptx - e.tx;
        const ddy = pty - e.ty;
        // Move one tile in dominant axis
        let moveTx = e.tx, moveTy = e.ty;
        if (Math.abs(ddx) >= Math.abs(ddy)) {
          moveTx += ddx > 0 ? 1 : -1;
          e.facingDir = ddx > 0 ? 'right' : 'left';
        } else {
          moveTy += ddy > 0 ? 1 : -1;
          e.facingDir = ddy > 0 ? 'down' : 'up';
        }
        if (_nfIsWalkable(moveTx, moveTy) && !_nfTileOccupied(moveTx, moveTy, e)) {
          e.tx = moveTx; e.ty = moveTy;
        }
      }
      continue;
    }

    // ── Patrol: wander near home, turn to look around ────────────────────
    e.patrolT += dt;
    const turnInterval = 2.5 + (e.uid.charCodeAt(3) % 3);  // 2.5-5.5s vary per enemy
    if (e.patrolT >= turnInterval) {
      e.patrolT = 0;
      e.patrolStep++;
      // Every 4 steps: look around (turn without moving)
      if (e.patrolStep % 4 === 0) {
        e.facingDir = DIRS[Math.floor(Math.random()*4)];
        continue;
      }
      // Try to move one tile in facing direction, or pick new direction
      const moveMap = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
      let [mdx, mdy] = moveMap[e.facingDir] || [0,0];
      const newTx = e.tx + mdx, newTy = e.ty + mdy;
      const homeDist = Math.abs(newTx-e.homeTx) + Math.abs(newTy-e.homeTy);
      if (_nfIsWalkable(newTx, newTy) && homeDist <= NF_PATROL_RADIUS
          && !_nfTileOccupied(newTx, newTy, e)) {
        e.tx = newTx; e.ty = newTy;
      } else {
        // Turn to a random new direction
        e.facingDir = DIRS[(DIRS.indexOf(e.facingDir) + 1 + Math.floor(Math.random()*3)) % 4];
      }
    }
  }
}

function _nfTileOccupied(tx, ty, self) {
  // Prevent two enemies from stacking on the same tile
  return NF.enemies.some(e => e !== self && e.alive && e.tx===tx && e.ty===ty);
}

function openNorthernField() {

  const _nfCv = document.getElementById('nf-canvas');

    _nfEl.style.flexDirection = 'column';
    _nfEl.style.pointerEvents = 'all';
    _nfEl.style.zIndex        = '50';  // explicit — overlays set to 500 beat this
  }
  // ── Virtual thumbstick on nf-canvas ────────────────────────────────────────
  const _nfCvEl = document.getElementById('nf-canvas');
  if (_nfCvEl) { _nfCvEl.style.pointerEvents='all'; NF._canvas=_nfCvEl; }
  // Show village joystick + act button over NF canvas (same z-index elevation)
  const _nfJoy = document.getElementById('surf-joy-zone');

  if (_nfJoy) { _nfJoy.style.display='flex'; _nfJoy.style.zIndex='450'; }
  if (_nfAct) { _nfAct.style.display='flex'; _nfAct.style.zIndex='450'; }
  if (_nfCvEl && !_nfCvEl._touchBound) {
    _nfCvEl._touchBound = true;
    // Thumbstick state — drawn in _nfDraw, updated here
    const STICK_R = 44;  // base radius px
    const KNOB_R  = 20;  // knob radius px
    const DEAD    = 10;  // dead zone px

    _nfCvEl.addEventListener('touchstart', ev=>{
      ev.preventDefault();
      if (NF.stick?.active) return;  // one finger only
      const t = ev.changedTouches[0];
      // Only activate if touch is in bottom-left 55% of screen
      if (t.clientX > _nfCvEl.clientWidth * 0.55) return;
      NF.stick = { active:true, id:t.identifier, baseX:t.clientX, baseY:t.clientY };
    }, {passive:false});

    _nfCvEl.addEventListener('touchmove', ev=>{
      ev.preventDefault();
      for (const t of ev.changedTouches) {
        if (!NF.stick || t.identifier !== NF.stick.id) continue;
        const dx = t.clientX - NF.stick.baseX;
        const dy = t.clientY - NF.stick.baseY;
        S.keys.left  = dx < -DEAD;
        S.keys.right = dx >  DEAD;
        S.keys.up    = dy < -DEAD;
        S.keys.down  = dy >  DEAD;
      }
    }, {passive:false});

    const _nfRelease = ev=>{
      for (const t of ev.changedTouches) {
        if (NF.stick && t.identifier === NF.stick.id) {
          NF.stick = null;
          S.keys.left=S.keys.right=S.keys.up=S.keys.down=false;
        }
      }
    };
    _nfCvEl.addEventListener('touchend',    _nfRelease, {passive:false});
    _nfCvEl.addEventListener('touchcancel', _nfRelease, {passive:false});
  }
  sfx('ambient_field', 0.4);
  if (!NF.animId) { NF.lastTs=0; NF.animId=requestAnimationFrame(_nfLoop); }
  setStatus('Northern Field — enemies hunt here. Find and fight them.');
}

  const _joyEl2 = document.getElementById('surf-joy-zone');
  const _actEl2 = document.getElementById('surf-act-btn');
  if (_joyEl2) _joyEl2.style.zIndex='';
  if (_actEl2) _actEl2.style.zIndex='';
  const _nfEl2 = document.getElementById('ov-nfield');
  if (_nfEl2) {
    _nfEl2.classList.remove('on');
    _nfEl2.style.display  = 'none';
    _nfEl2.style.zIndex   = '';
  }
  // Reset any boosted overlay z-indexes
  _SURF_OVLS.forEach(k => {
    const el = document.getElementById('surf-ovl-'+k);
    if (el) { el.classList.remove('on'); el.style.zIndex=''; }
  });
  // Return player to their entry x coordinate, just below the north gate
  S.px = NF._entryX || 16 * TILE_SIZE;
  S.py = 3 * TILE_SIZE;
  setStatus('You return south to the village.');
}

function _nfIsWalkable(tx,ty) {
  if (tx<0||tx>=NF_W||ty<0||ty>=NF_H) return false;
  const t = NF_TILES[ty*NF_W+tx];
  return t!==4 && t!==5 && t!==15 && t!==8;
}

function _nfLoop(ts) {
  if (!NF.active) return;
  NF.animId = requestAnimationFrame(_nfLoop);
  const dt = NF.lastTs ? Math.min((ts-NF.lastTs)/1000, 0.1) : 0.016;
  NF.lastTs = ts;

  // Input — keyboard (S.keys) OR village joystick (S.joystickX/Y)
  let dx=0, dy=0;
  // Freeze during combat AND during defeat fade-out (combat.ended=true)
  if (S.combat.active || S.combat.ended) { _nfDraw(); return; }
  if (S.keys.left)  dx=-1;
  if (S.keys.right) dx=1;
  if (S.keys.up)    dy=-1;
  if (S.keys.down)  dy=1;
  // Joystick axes override keys when active
  if (S.joystickActive) {
    dx = Math.abs(S.joystickX||0) > 0.15 ? S.joystickX : dx;
    dy = Math.abs(S.joystickY||0) > 0.15 ? S.joystickY : dy;
  }

  NF.moving = !!(dx||dy);
  if (dx||dy) {
    const speed = WALK_SPEED * NF_TILE * dt;
    const margin = NF_TILE*0.4;
    const nx = NF.px + dx*speed;
    const ny = NF.py + dy*speed;
    if (_nfIsWalkable(Math.floor((nx + margin*Math.sign(dx||1))/NF_TILE), Math.floor(NF.py/NF_TILE)))
      NF.px = nx;
    if (_nfIsWalkable(Math.floor(NF.px/NF_TILE), Math.floor((ny + margin*Math.sign(dy||1))/NF_TILE)))
      NF.py = ny;
      NF.dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    NF.animT = (NF.animT||0) + dt;
  }

  // South edge exit
  if (NF.py / NF_TILE >= NF_H - 2.5) {
    closeNorthernField(); return;
  }

  // Update enemy patrol / vision AI
  if (!S.combat.active) _nfUpdateEnemies(dt);

  // Enemy proximity combat — engage if enemy walked into player
  if (!S.combat.active) {
    const ptx = Math.floor(NF.px/NF_TILE), pty = Math.floor(NF.py/NF_TILE);
    for (const e of NF.enemies) {
      if (!e.alive) continue;
      const dist = Math.abs(e.tx-ptx)+Math.abs(e.ty-pty);
      if (dist <= 1) {
        // Redirect combat to NF context
        _nfStartCombat(e); break;
      }
    }
  }

  _nfDraw();
}

function _nfStartCombat(e) {
  if (S.combat.active) return;
  const def = ENEMY_DEFS[e.type]; if (!def) return;
  // Build the enemy object directly — don't use startCombat(idx)
  // because NF enemies aren't in S.enemies[]
  const nfEnemy = { ...def, type:e.type, alive:true,
    currentHp:e.currentHp, maxHp:def.hp, _nfRef:e };
  S.combat.active     = true;
  S.combat.enemy      = nfEnemy;
  S.combat.enemyIdx   = -1;  // signal: NF enemy, not in S.enemies[]
  S.combat.log        = [];
  S.combat.playerTurn = true;
  S.combat.shotsLeft  = S.captain.ranged?.shotsPerCombat || 3;
  S.combat.ended      = false;
  _lastAttackT = 0;
  Object.assign(_cbtA,{t:0,capOffX:0,enmOffX:0,capFlash:0,enmFlash:0,
    atkPhase:null,atkT:0,dmgNums:[],menuCat:'attack',menuFocus:0,btnsOn:false});
  document.getElementById('surf-combat').style.display='flex';
  startCombatMusic();
  const cv=document.getElementById('sc-scene');
  if (cv){cv.width=cv.clientWidth||360;cv.height=Math.min(Math.floor(cv.clientWidth*0.48),220);}
  _cbtStartScene();  // start the render loop — this is what draws sprites
  cbtMenuCat('dummy'); _cbtBuildSub();
  sfx('combat_start',0.8);
  // Initiative roll — who goes first
  const initRoll = Math.random()*10 + (S.captain.level||1)*2;
  const enmInit  = Math.random()*10 + def.initiative;
  if (enmInit > initRoll) {
    S.combat.playerTurn = false;
    cbtLog(nfEnemy.name+' moves first!','warn');
    setTimeout(_cbtEnemyTurn, 800);
  } else {
    cbtLog('You face a '+nfEnemy.name+'. Your move.','');
  }
  setTimeout(()=>{ _setCbtBtns(true); _cbtBuildSub(); }, 200);
}

// Hook combat victory to track NF kills and remove enemy
// NF kill tracking is now inline in cbtWin below

function _nfDraw() {
  const _nfHpEl=document.getElementById('nf-hud-hp');
  const _nfHpf =document.getElementById('nf-hud-hpf');
  const _nfLvEl=document.getElementById('nf-hud-lv');
  const _nfClk =document.getElementById('nf-hud-clock');
  const _nfFat =document.getElementById('nf-hud-fatigue');
  if(_nfHpEl) _nfHpEl.textContent=(S.captain.hp||0)+'/'+(S.captain.maxHp||30);
  if(_nfHpf)  _nfHpf.style.width=Math.max(0,Math.min(100,(S.captain.hp||0)/(S.captain.maxHp||30)*100))+'%';
  if(_nfLvEl) _nfLvEl.textContent='Lv '+(S.captain.level||1);
  if(_nfClk){const _h=document.getElementById('hud-clock');if(_h)_nfClk.textContent=_h.textContent;}
  if(_nfFat){const _f=document.getElementById('hud-fatigue');if(_f){_nfFat.textContent=_f.textContent;_nfFat.className=_f.className;}}
  const _nfStat=document.getElementById('nf-status-text');
  const alive2=NF.enemies.filter(e=>e.alive).length;
  if(_nfStat) _nfStat.textContent = S.quest.active
    ? 'Hunt: '+S.quest.killed+'/'+S.quest.target+' '+S.quest.label+(alive2===0?' — Field cleared!':'')
    : (alive2===0?'Field cleared! Walk south to return.':'Enemies: '+alive2+' remaining');
  const cv = document.getElementById('nf-canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const cW=cv.width, cH=cv.height;

  // Camera
  NF.cameraX = NF.px - cW/2 + NF_TILE/2;
  NF.cameraY = NF.py - cH/2 + NF_TILE/2;
  NF.cameraX = Math.max(0, Math.min(NF.cameraX, NF_W*NF_TILE-cW));
  NF.cameraY = Math.max(0, Math.min(NF.cameraY, NF_H*NF_TILE-cH));

  ctx.clearRect(0,0,cW,cH);
  ctx.fillStyle='#0a0c06'; ctx.fillRect(0,0,cW,cH);

  const offX=-NF.cameraX, offY=-NF.cameraY;
  const tileSet = IMGS['tileset'];
  const NF_COL = {0:'#243018',3:'#182408',4:'#0e1a06',5:'#0e1a06',15:'#0a0808'};
  const startTx=Math.max(0,Math.floor(NF.cameraX/NF_TILE));
  const startTy=Math.max(0,Math.floor(NF.cameraY/NF_TILE));
  const endTx=Math.min(NF_W,startTx+Math.ceil(cW/NF_TILE)+2);
  const endTy=Math.min(NF_H,startTy+Math.ceil(cH/NF_TILE)+2);

  for (let ty=startTy;ty<endTy;ty++) {
    for (let tx=startTx;tx<endTx;tx++) {
      const tid=NF_TILES[ty*NF_W+tx]||0;
      const dx=Math.floor(tx*NF_TILE+offX), dy=Math.floor(ty*NF_TILE+offY);
      if (tileSet?.complete && tileSet.naturalWidth>0 && TILE_UV[tid]) {
        const [uc,ur]=TILE_UV[tid];
        ctx.drawImage(tileSet,uc*TILE_SIZE,ur*TILE_SIZE,TILE_SIZE,TILE_SIZE,dx,dy,NF_TILE,NF_TILE);
      } else {
        ctx.fillStyle=NF_COL[tid]||'#1a2010'; ctx.fillRect(dx,dy,NF_TILE,NF_TILE);
      }
    }
  }

  // Draw enemies using idle sprite (row 0, animated across 4 frames)
  // Watcher uses its own 4-frame idle strip (192×48, 48×48 per frame)
  // Falls back to combat sheet if idle sheet not yet uploaded
  const ENM_IMGS = {
    crawler: IMGS['cbt_crawler'],
    lurker:  IMGS['cbt_lurker'],
    watcher: IMGS['nf_watcher_idle'] && IMGS['nf_watcher_idle'].naturalWidth > 0
             ? IMGS['nf_watcher_idle'] : IMGS['cbt_watcher'],
  };
  const ENM_HP   = { crawler:18, lurker:30, watcher:45 };
  const ENM_FW=64, ENM_FH=64;  // enemy sheets: 256×256, 4×4 grid, 64×64 per frame
  const nfAnimFrame = Math.floor(Date.now()/300)%4;  // idle cycle 4 frames
  for (const e of NF.enemies) {
    if (!e.alive) continue;
    const ex=Math.floor(e.tx*NF_TILE+offX), ey=Math.floor(e.ty*NF_TILE+offY);
    if (ex<-NF_TILE||ex>cW||ey<-NF_TILE||ey>cH) continue;
    const eImg = ENM_IMGS[e.type];
    if (eImg && eImg.naturalWidth>0) {
      // Frame dimensions: always 4 columns wide.
      // Watcher idle strip is single-row (192×48) so height = naturalHeight.
      // Combat sheets are 4×4 grids so height = naturalHeight/4.
      const _fw = Math.floor(eImg.naturalWidth / 4);
      const _fh = (e.type === 'watcher' && eImg === IMGS['nf_watcher_idle'])
                  ? eImg.naturalHeight           // single-row idle strip
                  : Math.floor(eImg.naturalHeight / 4);  // 4×4 combat sheet
      const _srcX = nfAnimFrame * _fw;
      const _srcY = 0;  // row 0 = idle
      // Watcher draws at native 64x64; others at 32x32
      const _isWatcher = e.type === 'watcher';
      const _drawW = _isWatcher ? _fw       : NF_TILE;
      const _drawH = _isWatcher ? _fh       : NF_TILE;
      // Anchor horizontally centred on tile, feet at tile bottom
      const _destX = Math.round(ex - (_drawW - NF_TILE) / 2);
      const _destY = Math.round(ey - (_drawH - NF_TILE));
      // Flip horizontally using offscreen canvas to avoid clip issues with translate/scale
      ctx.save();
      ctx.translate(_destX + _drawW, _destY);
      ctx.scale(-1, 1);
      ctx.drawImage(eImg, _srcX, _srcY, _fw, _fh, 0, 0, _drawW, _drawH);
      ctx.restore();
    } else {
      const ECOL={crawler:'#1a3a10',lurker:'#555050',watcher:'#3a1a4a'};
      ctx.fillStyle=ECOL[e.type]||'#333'; ctx.fillRect(ex+4,ey+4,NF_TILE-8,NF_TILE-8);
    }
    // Vision cone
    if (!e.alerted) {
      const faceAng = {up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[e.facingDir]||0;
      ctx.save();
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = '#ffee44';
      ctx.beginPath();
      ctx.moveTo(ex+NF_TILE/2, ey+NF_TILE/2);
      ctx.arc(ex+NF_TILE/2, ey+NF_TILE/2,
        NF_VISION_RANGE*NF_TILE, faceAng-NF_VISION_ARC, faceAng+NF_VISION_ARC);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      // Alert indicator — red exclamation
      ctx.fillStyle='#ff3333'; ctx.font='bold 14px Courier New';
      ctx.fillText('!', ex+NF_TILE/2-4, ey-6);
    }
    // HP bar
    const maxHp=ENM_HP[e.type]||20;
    const hpPct=Math.max(0,e.currentHp/maxHp);
    ctx.fillStyle='#330000'; ctx.fillRect(ex,ey-5,NF_TILE,3);
    ctx.fillStyle='#cc3322'; ctx.fillRect(ex,ey-5,NF_TILE*hpPct,3);
  }

  // Draw player
  const px=Math.floor(NF.px+offX), py=Math.floor(NF.py+offY);
  const capImg = IMGS['player'];  // loaded as 'player' from surface/player.png
  const NF_FW=32, NF_FH=32;  // player sheet: 32×32 frames
  if (capImg && capImg.naturalWidth>0) {
    const DR_={down:0,left:1,right:2,up:3};
    const capRow=DR_[NF.dir]||0;
    const capFrame=NF.moving ? (Math.floor(NF.animT*8)%4) : 0;
    ctx.drawImage(capImg,capFrame*NF_FW,capRow*NF_FH,NF_FW,NF_FH,px,py,NF_TILE,NF_TILE);
  } else {
    ctx.fillStyle='#4488ff'; ctx.fillRect(px+6,py+4,20,24);
  }

  // HUD is now in HTML bars above/below canvas
}

// North exit trigger — check in main game loop
function _checkNorthExit() {
  const pty = Math.floor(S.py/TILE_SIZE);
  const ptx = Math.floor(S.px/TILE_SIZE);
  // North edge: ty <= 0 and near the north path column (tx ~23)
  if (pty <= 0 && Math.abs(ptx-16) <= 2) {
    openNorthernField();
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
function init(){
  // 1. Load captain from localStorage FIRST — captain.js owns all defaults.
  //    This must run before loadEntryData() so mergeCaptainFromEntry has
  //    a valid base object to merge incoming session data onto.
  S.captain = loadCaptain();
  // 2. Merge any incoming data from index.html (sessionStorage handshake)
  loadEntryData();
  _loadSurfSounds();
  initEnemies();
  // Only give starter gear on very first surface visit (empty inv, no flag).
  // descendToSurface always sets gearGiven:true in the entry so this
  // only fires when opening surface.html directly without the handshake.
  if (!S.captain.gearGiven && S.captain.inv.length === 0) initStarterGear();

  // Fade in
  const ov = document.getElementById('transition-overlay');
  ov.classList.add('fade-in');
  setTimeout(() => {
    ov.style.transition = 'opacity 0.5s ease';
    ov.classList.remove('fade-in');
    ov.classList.add('fade-out');
    setTimeout(() => { ov.style.transition = ''; }, 600);
  }, 100);

  // Start loop once images have had a moment to load
  setTimeout(() => { loop(performance.now()); }, 200);
}

init();
</script>
