<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<title>Fentheris — Surface</title>
<style>
:root { --fs:1; }
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#000; color:#ccc4e0;
  font-family:'Courier New',monospace;
}
/* ── Cinzel headings ─────────────────────────────────────────── */
.cinzel { font-family:'Cinzel',serif; }

/* ── Main canvas layout ──────────────────────────────────────── */

  /* ── HUD bar (matches index.html header style) ─────────────── */
  #hud {
    position:absolute; top:0; left:0; right:0; height:44px; z-index:20;
    background:rgba(4,0,13,0.96); border-bottom:1px solid rgba(68,17,136,0.4);
    display:flex; align-items:center; gap:10px; padding:0 14px;
    font-family:'Cinzel',serif; font-size:11px; color:#ccc4e0; letter-spacing:1px;
  }
  #hud-title {
    font-family:'Cinzel',serif; font-weight:700; font-size:14px;
    color:#e8d5ff; letter-spacing:3px; margin-right:4px;
  }
  #hud-sep { color:rgba(102,51,170,0.5); font-size:18px; }
  #hud-location { font-size:10px; color:#9966cc; letter-spacing:2px; }
  #hud-clock { color:#b8b0d0; font-size:10px; margin-left:auto; letter-spacing:1px; }
  #hud-fatigue { padding:2px 8px; border-radius:2px; font-size:10px; font-family:'Courier New',monospace; }
  #hud-fatigue.fresh    { background:#001a0a; color:#44ee88; border:1px solid rgba(34,170,85,0.3); }
  #hud-fatigue.fatigued { background:#1a0800; color:#ff8844; border:1px solid rgba(170,68,0,0.3); }
  #hud-fatigue.exhausted{ background:#1a0000; color:#ff4444; border:1px solid rgba(170,0,0,0.3); }

  #surface-canvas {
    position:absolute; top:44px; left:0;
    width:100%; height:calc(100% - 44px - 52px);
    image-rendering:pixelated; image-rendering:crisp-edges;
    cursor:default; pointer-events:none;
  }
  #canvas-click-zone {
    position:absolute; top:44px; left:0;
    width:100%; height:calc(100% - 44px - 52px); z-index:5;
  }

  /* ── Bottom action bar (matches index.html) ──────────────────── */
  #bottom-bar {
    position:absolute; bottom:0; left:0; right:0; height:52px; z-index:20;
    background:rgba(4,0,13,0.96); border-top:1px solid rgba(68,17,136,0.4);
    display:flex; align-items:center; gap:8px; padding:0 12px;
  }
  .hud-btn {
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px;
    padding:7px 14px; border-radius:3px; cursor:pointer;
    text-transform:uppercase; border:1px solid; transition:all 0.15s;
    background:rgba(20,5,45,0.88); color:#ccc4e0;
  }
  #btn-return { border-color:rgba(102,51,170,0.53); }
  #btn-return:hover { border-color:#9966dd; color:#e8d5ff; }
  #btn-rest   { border-color:rgba(60,40,100,0.5); color:#9988cc; }
  #btn-rest:hover { border-color:#9988ff; color:#ccbbff; }
  .ovl-btn {
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px;
    padding:6px 12px; border:1px solid rgba(102,51,170,0.533); border-radius:3px;
    background:rgba(20,5,45,0.88); color:#ccc4e0; cursor:pointer; transition:all 0.15s;
  }
  .ovl-btn:hover { border-color:#9966dd; color:#e8d5ff; }
  #status-text {
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:10px; color:#7766aa; font-style:italic; letter-spacing:0.5px;
  }

  /* ── Dialogue box ────────────────────────────────────────────── */
  #dialogue-box {
    position: absolute; bottom: 60px; left: 10px; right: 10px;
    background: rgba(8,4,16,0.96); border: 1px solid rgba(180,140,60,0.5);
    border-radius: 4px; padding: 14px 16px;
    z-index: 30; display: none;
    font-size: 12px; color: #d4c09a; line-height: 1.7;
    max-height: 140px; overflow-y: auto;
  }
  #dialogue-box .dlg-name {
    font-family: 'Georgia', serif; font-size: 13px;
    color: #e8c87a; margin-bottom: 6px; letter-spacing: 1px;
  }
  #dialogue-box .dlg-close {
    position: absolute; top: 8px; right: 10px;
    background: none; border: none; color: #887744;
    font-size: 14px; cursor: pointer;
  }
  #dialogue-box .dlg-close:hover { color: #ffd080; }

  /* -- Mobile joystick --------------------------------------------------- */
  /* ── Northern Field HUD + bottom bar ─────────────────────────── */
  #nf-hud {
    height:44px; flex-shrink:0;
    background:rgba(4,0,13,0.96); border-bottom:1px solid rgba(68,17,136,0.4);
    display:flex; align-items:center; gap:10px; padding:0 14px;
    font-family:'Cinzel',serif; font-size:11px; color:#ccc4e0; letter-spacing:1px;
    z-index:2; position:relative;
  }
  #nf-bottom-bar {
    height:52px; flex-shrink:0;
    background:rgba(4,0,13,0.96); border-top:1px solid rgba(68,17,136,0.4);
    display:flex; align-items:center; gap:8px; padding:0 12px;
    z-index:2; position:relative;
  }

  #surf-joy-zone {
    position:absolute; bottom:68px; left:18px;
    width:104px; height:104px; z-index:25;
    display:none; touch-action:none; pointer-events:all;
  }
  #surf-joy-base { width:104px; height:104px; border-radius:50%;
    background:rgba(80,50,10,0.18); border:1px solid rgba(180,140,60,0.28); position:relative; }
  #surf-joy-knob { position:absolute; top:50%; left:50%;
    width:40px; height:40px; border-radius:50%;
    background:rgba(200,160,80,0.30); border:1px solid rgba(220,180,80,0.55);
    transform:translate(-50%,-50%); pointer-events:none; }
  #surf-act-btn {
    position:absolute; bottom:80px; right:22px;
    width:52px; height:52px; border-radius:50%;
    background:rgba(40,20,5,0.88); border:1px solid rgba(180,140,60,0.45);
    color:#e8c87a; font-size:18px;
    display:none; align-items:center; justify-content:center;
    cursor:pointer; z-index:25; touch-action:none; pointer-events:all;
    user-select:none; -webkit-user-select:none;
  }
  #surf-act-btn:active { background:rgba(100,70,10,0.95); }

  /* ── Captain HUD strip ───────────────────────────────────────── */
  #hud-captain { display:flex; align-items:center; gap:8px; margin-left:8px; }
  #hud-cap-lv  { font-family:'Cinzel',serif; color:#cc99ff; font-size:10px; white-space:nowrap; }
  #hud-cap-hp  { color:#cc7777; font-size:10px; white-space:nowrap; }
  .hud-hp-mini { display:inline-block; width:44px; height:4px;
    background:rgba(30,10,60,0.8); border-radius:2px; overflow:hidden; vertical-align:middle; }
  .hud-hp-mini-fill { height:100%; background:#cc4444; transition:width 0.2s; }

  /* ── Overlay system (mirrors index.html exactly) ─────────────── */
  .ovlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:none; flex-direction:column; align-items:center; justify-content:flex-start;
    background:rgba(3,0,12,0.96); padding:16px 16px 32px; gap:10px;
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth; z-index:40; touch-action:pan-y; pointer-events:none;
  }
  .ovlay.on { display:flex; pointer-events:all; }
  .ovl-title-row {
    display:flex; align-items:center; justify-content:space-between;
    width:100%; max-width:640px; gap:10px; margin-bottom:2px;
  }
  .ovl-title { font-family:'Cinzel',serif; font-size:17px; letter-spacing:3px; color:#e8d5ff; }
  .ovl-close-btn {
    background:rgba(30,12,8,0.85); border:1px solid rgba(170,102,51,0.333);
    border-radius:3px; color:#ddaa77; font-size:13px; padding:6px 12px;
    cursor:pointer; font-family:'Cinzel',serif; letter-spacing:1px; flex-shrink:0;
  }
  .ovl-close-btn:hover { border-color:#ddaa77; color:#fff8e8; }
  /* Save overlay */
  .briefing-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:600;
    display:flex; align-items:center; justify-content:center; background:rgba(2,0,8,0.95);
  }
  .briefing-panel {
    background:rgba(8,2,22,0.98); border:1px solid rgba(68,17,136,0.4);
    border-radius:8px; padding:16px 14px; max-width:500px; width:95%;
    max-height:90vh; display:flex; flex-direction:column; gap:0;
    box-shadow:0 0 50px rgba(51,0,102,0.267); overflow-y:auto;
  }
  .briefing-title {
    font-family:'Cinzel',serif; font-size:15px; letter-spacing:3px; color:#e8d5ff;
    text-align:center; padding-bottom:12px;
    border-bottom:1px solid rgba(102,51,170,0.3); margin-bottom:14px;
  }
  .save-slot {
    display:flex; align-items:flex-start; gap:10px; padding:10px 12px;
    border:1px solid rgba(68,17,136,0.3); border-radius:4px;
    background:rgba(12,4,28,0.8); margin-bottom:8px;
  }
  .save-slot.empty { opacity:0.55; }
  .save-info { flex:1; min-width:0; }
  .save-name { font-family:'Cinzel',serif; font-size:11px; color:#e8d5ff; margin-bottom:3px; }
  .save-detail { font-size:9px; color:#8877aa; line-height:1.6; }
  .save-actions { display:flex; flex-direction:column; gap:4px; flex-shrink:0; align-items:flex-end; }
  .surf-save-lbl {
    font-family:'Cinzel',serif; font-size:9px; letter-spacing:2px;
    color:#665577; text-transform:uppercase; margin-bottom:5px; margin-top:4px;
  }
  /* Inventory */
  .filter-row { display:flex; flex-wrap:wrap; gap:5px; width:100%; max-width:640px; }
  .fbtn {
    font-family:'Cinzel',serif; font-size:9px; letter-spacing:1px; padding:5px 10px;
    border:1px solid rgba(51,0,85,0.4); border-radius:2px;
    background:rgba(15,3,35,0.8); color:#ccc4e0; cursor:pointer; transition:all 0.15s;
  }
  .fbtn:hover,.fbtn.act { border-color:#9966dd; color:#cc99ff; }
  .inv-body { display:flex; gap:16px; width:100%; max-width:640px; }
  .inv-grid-wrap { flex:1; }
  .inv-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .inv-item {
    background:rgba(18,4,40,0.85); border:1px solid rgba(51,0,68,0.4);
    border-radius:4px; padding:8px 5px; text-align:center;
    cursor:pointer; transition:all 0.15s; font-size:10px; color:#ccc4e0;
  }
  .inv-item:hover { border-color:#9966dd; background:rgba(40,10,80,0.9); }
  .inv-item.sel   { border-color:#cc99ff; background:rgba(60,20,100,0.9); }
  .inv-ico   { font-size:22px; margin-bottom:4px; }
  .inv-iname { font-size:9px; color:#b8b0d0; line-height:1.3; }
  .inv-empty { font-size:11px; color:#665577; font-style:italic; padding:20px 0; text-align:center; width:100%; }
  .inv-detail {
    width:160px; flex-shrink:0; background:rgba(12,4,28,0.9);
    border:1px solid rgba(68,17,136,0.3); border-radius:4px; padding:12px;
    display:flex; flex-direction:column; gap:8px;
  }
  .inv-detail-ico  { font-size:32px; text-align:center; }
  .inv-detail-name { font-family:'Cinzel',serif; font-size:11px; color:#e8d5ff; text-align:center; }
  .inv-detail-desc { font-size:10px; color:#9988bb; line-height:1.5; }
  .inv-detail-val  { font-size:10px; color:#ccc4e0; }
  #inv-footer { font-size:9px; color:#665577; margin-top:6px; width:100%; max-width:640px; }
  /* Buttons */
  .btn {
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px;
    padding:7px 14px; border-radius:3px; cursor:pointer;
    border:1px solid rgba(102,51,170,0.53); background:rgba(20,5,45,0.88); color:#ccc4e0;
    transition:all 0.15s; user-select:none; -webkit-user-select:none;
  }
  .btn:hover { border-color:#9966dd; color:#e8d5ff; }
  .btn.gd   { border-color:rgba(34,136,68,0.5); color:#88cc88; }
  .btn.gd:hover  { border-color:#44cc88; }
  .btn.dmg  { border-color:rgba(170,51,34,0.5); color:#cc6655; }
  .btn.dmg:hover { border-color:#cc4422; }
  .btn.sm   { font-size:9px; padding:5px 10px; }
  .ssbtn {
    font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.5px; padding:5px 10px;
    border-radius:2px; cursor:pointer; white-space:nowrap;
    border:1px solid rgba(102,51,170,0.4); background:rgba(14,4,32,0.9); color:#ccc4e0;
    transition:all 0.12s;
  }
  .ssbtn:hover { border-color:#9966dd; color:#e8d5ff; }
  .ssbtn.gd   { border-color:rgba(34,136,68,0.5); color:#88cc88; }
  .ssbtn.gd:hover { border-color:#44cc88; }
  .ssbtn.dmg  { border-color:rgba(170,51,34,0.5); color:#cc6655; }
  .ssbtn.dmg:hover { border-color:#cc4422; }
  /* Stat panels */
  .pbox {
    background:rgba(8,2,22,0.85); border:1px solid rgba(68,17,136,0.3);
    border-radius:5px; padding:12px; width:100%; max-width:640px;
  }
  .ptitle {
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; color:#9977cc;
    text-transform:uppercase; margin-bottom:8px;
    border-bottom:1px solid rgba(68,17,136,0.2); padding-bottom:5px;
  }
  .srow { display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:11px; }
  .slabel { color:#8877aa; font-family:'Courier New',monospace; }
  .sval   { color:#e8d5ff; font-family:'Cinzel',serif; font-size:11px; }
  .bw { height:5px; background:rgba(30,10,60,0.8); border-radius:2px; margin:2px 0 4px; overflow:hidden; }
  .bf { height:100%; border-radius:2px; transition:width 0.4s; }
  .bh { background:#cc4444; } .ba { background:#44aacc; }
  .bx { background:#cc8822; } .bc { background:#44cc88; }
  /* Bottom bar sm buttons */
  .hud-btn-sm {
    font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.5px; padding:6px 10px;
    border:1px solid rgba(102,51,170,0.4); border-radius:3px; background:rgba(20,5,45,0.88);
    color:#9977cc; cursor:pointer; flex-shrink:0; white-space:nowrap;
    transition:all 0.12s; user-select:none; -webkit-user-select:none;
  }
  .hud-btn-sm:hover { border-color:#9966dd; color:#e8d5ff; }
  /* Combat overlay */
  #surf-combat {
    position:absolute; inset:0; z-index:200; background:rgba(2,0,8,0.98);
    display:none; flex-direction:column; align-items:stretch;
    font-family:'Courier New',monospace; overflow:hidden;
  }
  #sc-scene { width:100%; height:180px; flex-shrink:0; display:block; background:#000; }
  #sc-log {
    flex:1 1 auto; min-height:52px; max-height:90px; overflow-y:auto;
    padding:5px 10px; font-size:13px; color:#ccbbdd; line-height:1.65;
    border-top:1px solid rgba(68,17,136,0.2); border-bottom:1px solid rgba(68,17,136,0.2);
  }
  .sc-log-hit  { color:#ff9966; font-weight:600; } .sc-log-good { color:#88ff88; font-weight:600; }
  .sc-log-warn { color:#ffcc44; font-weight:600; } .sc-log-info { color:#9988aa; }
  #sc-menu { flex-shrink:0; padding:8px 10px 10px; display:flex; flex-direction:column; gap:5px; }
  #sc-menu-cats { display:flex; gap:6px; }
  .sc-cat {
    flex:1; padding:9px 4px; font-family:'Cinzel',serif; font-size:14px; letter-spacing:1px;
    text-transform:uppercase; border-radius:3px; cursor:pointer;
    border:1px solid rgba(102,51,170,0.3); background:rgba(14,4,32,0.9); color:#ffffff; font-weight:700;
    transition:all 0.1s; user-select:none; -webkit-user-select:none;
  }
  .sc-cat.active { background:rgba(30,10,70,0.95); border-color:#9966dd; color:#ffffff; font-weight:700; }
  .sc-cat-flee   { border-color:rgba(100,80,40,0.3); color:#ffcc88; font-weight:700; }
  #sc-menu-sub { display:flex; flex-direction:column; gap:4px; min-height:40px; }
  .sc-sub {
    padding:13px 16px; font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.5px;
    border-radius:2px; cursor:pointer; border:1px solid rgba(68,17,136,0.25);
    background:rgba(6,2,16,0.9); color:#ffffff; font-weight:700;
    display:flex; justify-content:space-between; align-items:center; transition:all 0.1s;
    user-select:none; -webkit-user-select:none;
  }
  .sc-sub.focused { background:rgba(30,8,60,0.95); border-color:#9966dd; color:#ffffff; }
  .sc-sub:disabled { opacity:0.25; cursor:default; }
  .sc-sub-hint { font-size:13px; color:#ddbbff; font-weight:600; margin-left:8px; }
  /* Shop overlay */
  /* ── Surface Shop (mirrors index.html port shop) ─────────────── */
  #surf-shop {
    position:absolute; inset:0; z-index:35;
    background:rgba(3,0,12,0.96);
    display:none; flex-direction:column; align-items:center;
    overflow:hidden; padding:14px 12px 10px; gap:0;
  }
  #surf-shop-hdr {
    display:flex; align-items:center; width:100%; max-width:640px; margin-bottom:8px; gap:8px;
  }
  #surf-shop-npc  { flex:1; font-family:'Cinzel',serif; font-size:15px; color:#e8d5ff; letter-spacing:2px; }
  #surf-shop-ts   { font-size:11px; color:#cc99ff; white-space:nowrap; font-family:'Cinzel',serif; }
  #surf-shop-close { background:rgba(30,12,8,0.85); border:1px solid rgba(170,102,51,0.333);
    border-radius:3px; color:#ddaa77; font-size:12px; padding:5px 12px;
    cursor:pointer; font-family:'Cinzel',serif; letter-spacing:1px; }
  #surf-shop-close:hover { border-color:#ddaa77; color:#fff8e8; }
  .surf-shop-tabs { display:flex; gap:6px; width:100%; max-width:640px; margin-bottom:8px; }
  .surf-stab {
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px; padding:5px 12px;
    border:1px solid rgba(51,0,85,0.4); border-radius:2px;
    background:rgba(15,3,35,0.8); color:#9977cc; cursor:pointer; transition:all 0.15s;
  }
  .surf-stab.active,.surf-stab:hover { border-color:#9966dd; color:#cc99ff; background:rgba(40,10,80,0.9); }
  #surf-shop-sell-filters { display:none; gap:4px; width:100%; max-width:640px; margin-bottom:6px; flex-wrap:wrap; }
  #surf-shop-sell-filters.on { display:flex; }
  .surf-sflt {
    font-family:'Cinzel',serif; font-size:9px; letter-spacing:1px; padding:4px 10px;
    border:1px solid rgba(51,0,85,0.4); border-radius:2px;
    background:rgba(10,2,25,0.9); color:#8866aa; cursor:pointer; transition:all 0.12s;
  }
  .surf-sflt.active,.surf-sflt:hover { border-color:#9966dd; color:#cc99ff; background:rgba(40,10,80,0.9); }
  #surf-shop-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px;
    width:100%; max-width:640px; overflow-y:auto; flex:1; align-content:start;
    margin-bottom:6px; }
  .ssurf-item {
    background:rgba(16,4,38,0.88); border:1px solid rgba(68,17,136,0.4);
    border-radius:4px; padding:8px; text-align:center; cursor:pointer; transition:all 0.2s;
  }
  .ssurf-item:hover:not(.dis) { border-color:#aa77ff; background:rgba(35,10,75,0.9); transform:translateY(-2px); }
  .ssurf-item.dis  { opacity:0.4; cursor:not-allowed; transform:none; }
  .ssurf-item.sell-all { border-color:rgba(68,238,136,0.4); }
  .ssurf-name { font-family:'Cinzel',serif; font-size:11px; color:#c8a0ff; margin-bottom:2px; }
  .ssurf-desc { font-size:10px; color:#c0b8dc; margin-bottom:4px; }
  .ssurf-cost { font-size:11px; color:#ffd700; }
  .ssurf-sell { font-size:11px; color:#44ee88; }
  #surf-shop-msg { width:100%; max-width:640px; padding:4px 0 2px;
    font-size:10px; font-style:italic; color:#665577; min-height:20px; }


  /* Minimap */
  #surf-minimap-shell {
    position:absolute; bottom:64px; right:12px; z-index:22;
    display:flex; flex-direction:column; align-items:flex-end; gap:3px;
  }
  #surf-minimap-toggle {
    background:rgba(4,0,13,0.9); border:1px solid rgba(68,17,136,0.4); border-radius:3px;
    color:#9966cc; font-size:9px; padding:4px 8px; cursor:pointer;
    font-family:'Cinzel',serif; letter-spacing:1px; user-select:none; -webkit-user-select:none;
  }
  #surf-minimap-toggle:hover { color:#e8d5ff; border-color:#9966dd; }
  #surf-minimap {
    border-radius:50%; border:1px solid rgba(68,17,136,0.4);
    display:block; background:#050208; box-shadow:0 0 14px rgba(51,0,102,0.4);
  }
  #surf-minimap-shell.minimized #surf-minimap { display:none; }


  /* ── Transition overlay ──────────────────────────────────────── */

// Load all sounds — fetch HEAD first so missing files never throw
function _loadSurfSounds() {
  // Directly create Audio elements — no fetch needed.
  // If a file is missing the browser fires an error event which we ignore.
  Object.entries(SURF_SOUND_DATA).forEach(([key, path]) => {
    try {
      const a = new Audio();
      a.preload = 'auto';
      a.onerror = () => { delete _SURF_SFX[key]; }; // remove if file 404s
      a.src = path;
      _SURF_SFX[key] = a; // register immediately; onerror cleans up if missing
    } catch(_) {}
  });
}

// Play a surface sound — completely safe if key is missing
function sfx(key, vol = 1.0) {
  if (_SURF_MUTED || !_SURF_SFX[key]) return;
  if (_SURF_VOL.master === 0 || _SURF_VOL.sfx === 0) return;
  try {
    const c = _SURF_SFX[key].cloneNode();
    c.volume = Math.min(1, Math.max(0, vol * _SURF_VOL.master * _SURF_VOL.sfx));
    c.play().catch(() => {});
  } catch(_) {}
}

// Enemy-type attack sound with fallback to generic enemy_hurt
function sfxEnemyAtk(enemyType) {
  const map = { crawler:'crawler_atk', lurker:'lurker_atk', watcher:'watcher_atk' };
  const key = map[enemyType] || 'enemy_hurt';
  if (_SURF_SFX[key]) sfx(key, 0.85);
  else sfx('enemy_hurt', 0.75);
}

let _ambientEl=null, _musicEl=null, _combatMusicEl=null;
let _musicIdx=0, _inCombatMusic=false;
const MUSIC_KEYS=['music_1','music_2','music_3','music_4','music_5'];

function startAmbient(){
  if(_ambientEl)return; const snd=_SURF_SFX['ambient_field'];if(!snd)return;
  try{_ambientEl=snd.cloneNode();_ambientEl.loop=true;
  _ambientEl.volume=Math.min(1,_SURF_VOL.master*_SURF_VOL.ambient*0.5);
  _ambientEl.play().catch(()=>{});}catch(_){}
}
function stopAmbient(){
  if(!_ambientEl)return;
  try{_ambientEl.pause();_ambientEl.currentTime=0;}catch(_){} _ambientEl=null;
}
function startMusic(){
  if(_musicEl||_inCombatMusic)return;
  let key=null;
  for(let i=0;i<MUSIC_KEYS.length;i++){
    const k=MUSIC_KEYS[(_musicIdx+i)%MUSIC_KEYS.length];
    if(_SURF_SFX[k]){key=k;_musicIdx=(_musicIdx+i)%MUSIC_KEYS.length;break;}
  }
  if(!key)return;
  try{
    _musicEl=_SURF_SFX[key].cloneNode();
    _musicEl.loop=false;
    _musicEl.volume=Math.min(1,_SURF_VOL.master*_SURF_VOL.music);
    _musicEl.onended=()=>{
      _musicEl=null;_musicIdx=(_musicIdx+1)%MUSIC_KEYS.length;
      if(!_inCombatMusic)setTimeout(startMusic,500);
    };
    _musicEl.play().catch(()=>{_musicEl=null;});
  }catch(_){_musicEl=null;}
}
function stopMusic(){
  if(!_musicEl)return;
  try{_musicEl.pause();_musicEl.currentTime=0;}catch(_){} _musicEl=null;
}
function startCombatMusic(){
  if(_inCombatMusic)return; _inCombatMusic=true;
  if(_musicEl)try{_musicEl.volume=0;}catch(_){}
  const snd=_SURF_SFX['combat_music'];if(!snd)return;
  try{
    _combatMusicEl=snd.cloneNode();_combatMusicEl.loop=true;
    _combatMusicEl.volume=Math.min(1,_SURF_VOL.master*_SURF_VOL.music);
    _combatMusicEl.play().catch(()=>{});
  }catch(_){}
}
function stopCombatMusic(){
  if(!_inCombatMusic)return; _inCombatMusic=false;
  if(_combatMusicEl){try{_combatMusicEl.pause();_combatMusicEl.currentTime=0;}catch(_){}_combatMusicEl=null;}
  if(_musicEl){try{_musicEl.volume=Math.min(1,_SURF_VOL.master*_SURF_VOL.music);}catch(_){}}
  else startMusic();
}
function stopAllAudio(){

const STONE_TILES = new Set([2, 9, 10, 15]);

let _stepTimer = 0;
const STEP_INTERVAL = 0.32; // seconds between steps at full speed

function _tickFootsteps(dt, moving) {
  if (!moving) { _stepTimer = 0; return; }
  _stepTimer += dt;
  if (_stepTimer >= STEP_INTERVAL) {
    _stepTimer = 0;
    const tx = Math.floor(S.px / TILE_SIZE);
    const ty = Math.floor(S.py / TILE_SIZE);
    const tile = MAP_TILES[ty * MAP_W + tx] ?? 0;
    const key  = STONE_TILES.has(tile) ? 'footstep_stone' : 'footstep_dirt';
    sfx(key, 0.17 + Math.random() * 0.08);
  }
}

function loadImg(key, src) {

  const im = new Image();
  im.onload  = () => { IMGS[key] = im; imgsLoaded++; };
  im.onerror = () => { imgsLoaded++; }; // silent fail — procedural fallback
  im.src = src;
}

// ── sessionStorage handshake — receive from index.html ────────────────────
function loadEntryData() {
  try {
    const raw = sessionStorage.getItem('fentheris_surface_entry');
    if (!raw) return;
    const d = JSON.parse(raw);
    S.day          = d.day        || 1;
    S.totalHours   = d.totalHours || 0;
    S.hoursAwake   = d.hoursAwake || 0;
    S.gold=d.gold||0;
    S.sessionStartHours=S.totalHours;
    S._indexEntry=d; // stash for unified saves
    // If loading from a surface save, restore position and enemy state
    if(d._savedSurface){
      const ss=d._savedSurface;
      if(ss.px) S.px=ss.px;
      if(ss.py) S.py=ss.py;
      if(ss.day) S.day=ss.day;
    }
    // Sync day counter from index.html so surface and space share the same clock
    if (d.day) S.day = d.day;
    // Captain comes from localStorage — loadCaptain() in init() already loaded it.
    // Only merge gear/scalars from entry (first-descent gearGiven handshake).
    if (d.captain) S.captain = mergeCaptainFromEntry(S.captain, { captain: d.captain });
    // Load ship PNG for dock rendering
    _loadDockShipImage(d.shipType || d.ship?.type || 'pinnace');
    sessionStorage.removeItem('fentheris_surface_entry');
  } catch(e) {}
}

// ── sessionStorage handshake — send back to index.html ───────────────────
function buildExitData() {
  const hoursSpent = S.sessionT * SURFACE_HOURS_PER_SEC;
  return {
    hoursSpent:  Math.round(hoursSpent * 100) / 100,
    hoursAwake:  S.hoursAwake + hoursSpent,
    totalHours:  S.totalHours + hoursSpent,
    day:         S.day,
    gold:        S.gold,
    captain:     S.captain,
    shipInv:     S.captain.inv,  // explicit inv sync back to G.ship.inv
  };
}

function returnToShip() {
  saveCaptain(S.captain);  // flush to localStorage before leaving

  stopAllAudio();
  surfAutoSave();
  closeDlg();
  const ov = document.getElementById('transition-overlay');
  ov.classList.add('fade-in');
  setTimeout(() => {
    try {
      sessionStorage.setItem('fentheris_surface_exit', JSON.stringify(buildExitData()));
      // Tell index.html to skip splash/cinematic and go straight to the game
      sessionStorage.setItem('fentheris_surface_return', '1');

// ── Surface rest ──────────────────────────────────────────────────────────
function surfaceRest() {
  S.hoursAwake = 0;
  S.totalHours += 8;
  // Advance day if midnight crossed
  const prevMidnights = Math.floor((S.totalHours - 8 + 6) / 24);
  const newMidnights  = Math.floor((S.totalHours + 6) / 24);
  S.day += newMidnights - prevMidnights;
  updateHUD();
  _drawMinimap();
  sfx('rest',0.65);
  surfAutoSave();
  Captain.fullHeal(S.captain);  // captain.js: HP→maxHp, persists
  // Respawn NF enemies every 3 days — not every rest
  const daysSinceRespawn = S.day - (S.nfRespawnDay || 1);
  if (daysSinceRespawn >= 3) {
    respawnEnemies();
    S.nfRespawnDay = S.day;
    setStatus('Rested 8 hours. Captain healed. The field stirs again — enemies have returned.');
  } else {
    const daysLeft = 3 - daysSinceRespawn;
    setStatus('Rested 8 hours. Captain healed. Enemies return in ~' + daysLeft + ' day(s).');
  }
}

// ── Tile helpers ──────────────────────────────────────────────────────────
function getTile(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return T.CLIFF;
  return MAP_TILES[ty * MAP_W + tx];
}

function isWalkable(tx, ty) {
  return !IMPASSABLE.has(getTile(tx, ty));
}

// ── Player movement ───────────────────────────────────────────────────────
function tryMove(dx, dy, dt) {
  dt = dt || (1/60);
  const spd     = TILE_SIZE * WALK_SPEED * dt;
  const nextPx  = S.px + dx * spd;
  const nextPy  = S.py + dy * spd;
  const margin  = TILE_SIZE * 0.38;  // collision box inset
  const slide   = spd * 0.9;         // slide nudge speed (slightly slower than walk)
  const T       = TILE_SIZE;

  // ── Helper: check if a pixel-space point is walkable ─────────────────────
  const wk = (px, py) => isWalkable(Math.floor(px / T), Math.floor(py / T));

  // ── Moving horizontally (dx ≠ 0) ─────────────────────────────────────────
  if (dx !== 0) {
    const ex    = nextPx + margin * Math.sign(dx);  // leading edge X
    const topOk = wk(ex, S.py + margin);            // top of player
    const botOk = wk(ex, S.py + T - margin);        // bottom of player

    if (topOk && botOk) {
      // Both clear — move normally
      S.px = Math.max(0, Math.min((MAP_W - 1) * T, nextPx));
    } else if (topOk && !botOk) {
      // Bottom corner is clipped — slide upward along the wall
      S.px = Math.max(0, Math.min((MAP_W - 1) * T, nextPx));
      if (isWalkable(Math.floor(S.px / T), Math.floor((S.py - slide) / T)))
        S.py = Math.max(0, S.py - slide);
    } else if (!topOk && botOk) {
      // Top corner is clipped — slide downward along the wall
      S.px = Math.max(0, Math.min((MAP_W - 1) * T, nextPx));
      if (isWalkable(Math.floor(S.px / T), Math.floor((S.py + slide) / T)))
        S.py = Math.min((MAP_H - 1) * T, S.py + slide);
    }
    // Both blocked: no movement (player stops cleanly)
  }

  // ── Moving vertically (dy ≠ 0) ────────────────────────────────────────────
  if (dy !== 0) {
    const ey     = nextPy + margin * Math.sign(dy);  // leading edge Y
    const leftOk = wk(S.px + margin,     ey);        // left of player
    const rgtOk  = wk(S.px + T - margin, ey);        // right of player

    if (leftOk && rgtOk) {
      // Both clear — move normally
      S.py = Math.max(0, Math.min((MAP_H - 1) * T, nextPy));
    } else if (leftOk && !rgtOk) {
      // Right corner is clipped — slide left along the wall
      S.py = Math.max(0, Math.min((MAP_H - 1) * T, nextPy));
      if (isWalkable(Math.floor((S.px - slide) / T), Math.floor(S.py / T)))
        S.px = Math.max(0, S.px - slide);
    } else if (!leftOk && rgtOk) {
      // Left corner is clipped — slide right along the wall
      S.py = Math.max(0, Math.min((MAP_H - 1) * T, nextPy));
      if (isWalkable(Math.floor((S.px + slide) / T), Math.floor(S.py / T)))
        S.px = Math.min((MAP_W - 1) * T, S.px + slide);
    }
    // Both blocked: no movement
  }

  if (dx !== 0 || dy !== 0) {
    S.dir=Math.abs(dx)>=Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
    S.moving = true;
  }

  // Check exit zone
  const tx = Math.floor(S.px / TILE_SIZE);
  const ty = Math.floor(S.py / TILE_SIZE);
  if (ty <= EXIT_ZONE.maxTy) {
    setStatus('⛵ You feel the pull of the void above. Press Return to Ship to ascend.');
  }
  if(!S.combat.active){
    const hit=S.enemies.findIndex(e=>e.alive&&e.tx===tx&&e.ty===ty);
    if(hit>=0)startCombat(hit);
  }
}

// ── Camera ────────────────────────────────────────────────────────────────
function updateCamera(cW, cH) {
  const targetX = S.px - cW / 2;
  const targetY = S.py - cH / 2;
  const maxX = MAP_W * TILE_SIZE - cW;
  const maxY = MAP_H * TILE_SIZE - cH;
  S.cameraX = Math.max(0, Math.min(maxX, targetX));
  S.cameraY = Math.max(0, Math.min(maxY, targetY));
}

// ── HUD update ────────────────────────────────────────────────────────────
function updateHUD() {
  if (!S.captain) return;  // guard: called before init() completes
  const h   = S.totalHours + S.sessionT * SURFACE_HOURS_PER_SEC;
  const hour = Math.floor((6 + h) % 24);

    `Day ${S.day} — ${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}`;

  badge.className = cls[lvl];

  const _ch=document.getElementById('hud-cap-hp');if(_ch)_ch.textContent=_cap.hp+'/'+_cap.maxHp;
  const _cf=document.getElementById('hud-cap-hpf');

  _cf.style.background=_cap.hp/_cap.maxHp>.5?'#cc4444':_cap.hp/_cap.maxHp>.25?'#cc8800':'#ff2222';}
}

function setStatus(text) {

}

// ── Procedural tile fallback (when tileset.png not loaded) ────────────────
const TILE_COLORS = [
  '#3a5a2a','#7a5a3a','#888899','#2a4a1a', // grass,dirt,stone,tgrass
  '#1a3a0a','#2a4a1a','#1a2a6a','#c8b060', // tree_t,tree_b,water,sand
  '#666677','#bbaa99','#886644','#aa8860', // wall,floor,door,wood
  '#555566','#444455','#4a7a3a','#444455', // rock,cave,flower,cliff
  '#8b6424','#8b6424','#8b6424','#8b6424','#8b6424','#8b6424','#8b6424', // 16-22 dirt path
  '#5a3a18','#d4c080', // 23=pew, 24=altar
  '#4a1a8a',           // 25=zone transition portal
];

function drawTileFallback(ctx, tileId, dx, dy) {
  const T_ = TILE_SIZE;
  if (tileId === 23) {
    ctx.fillStyle='#3a2208'; ctx.fillRect(dx,dy,T_,T_);
    ctx.fillStyle='#5a3818'; ctx.fillRect(dx+2,dy+4,T_-4,T_-12);
    ctx.fillStyle='#7a5228'; ctx.fillRect(dx+2,dy+5,T_-4,3);
    ctx.fillStyle='#2a1804'; ctx.fillRect(dx+2,dy+T_-9,T_-4,5);
    return;
  }
  if (tileId === 24) {
    ctx.fillStyle='#888070'; ctx.fillRect(dx,dy,T_,T_);
    ctx.fillStyle='#a09888'; ctx.fillRect(dx+1,dy+1,T_-2,T_-2);
    ctx.fillStyle='#c8a830'; ctx.fillRect(dx+3,dy+3,T_-6,T_-10);
    ctx.fillStyle='#e8c840'; ctx.fillRect(dx+5,dy+5,T_-10,T_-14);
    ctx.fillStyle='#fff8'; ctx.fillRect(dx+T_/2-1,dy+4,2,T_-12);
    ctx.fillStyle='#fff8'; ctx.fillRect(dx+4,dy+7,T_-8,2);
    return;
  }
  ctx.fillStyle = TILE_COLORS[tileId] || '#222';
  ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE);
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(dx, dy, TILE_SIZE, TILE_SIZE);
}

// ── Render ────────────────────────────────────────────────────────────────
function render(ctx, cW, cH) {
  ctx.clearRect(0, 0, cW, cH);

  // Background
  ctx.fillStyle = '#0a0806';
  ctx.fillRect(0, 0, cW, cH);

  const tileSet    = IMGS['tileset'];
  const dirtPathImg = IMGS['dirt_paths'];  // dirt path tile strip
  const camOffX   = -S.cameraX;
  const camOffY  = -S.cameraY;

  // ── Draw tiles ──
  const startTx = Math.floor(S.cameraX / TILE_SIZE);
  const startTy = Math.floor(S.cameraY / TILE_SIZE);
  const endTx   = Math.min(MAP_W, startTx + Math.ceil(cW / TILE_SIZE) + 2);
  const endTy   = Math.min(MAP_H, startTy + Math.ceil(cH / TILE_SIZE) + 2);

  for (let ty = startTy; ty < endTy; ty++) {
    for (let tx = startTx; tx < endTx; tx++) {
      const tileId = getTile(tx, ty);
      const dx = tx * TILE_SIZE + camOffX;
      const dy = ty * TILE_SIZE + camOffY;
      if (DIRT_PATH_IDS[tileId] !== undefined && dirtPathImg) {
        ctx.drawImage(dirtPathImg,
          DIRT_PATH_IDS[tileId] * TILE_SIZE, 0, TILE_SIZE, TILE_SIZE,
          dx, dy, TILE_SIZE, TILE_SIZE);
      } else if (tileSet?.complete && tileSet.naturalWidth > 0 && TILE_UV[tileId]) {
        // Only draw from tileset if this tile ID has a UV entry.
        // IDs 23+ (pew, altar) have no UV and must use procedural fallback.
        const [uc, ur] = TILE_UV[tileId];
        ctx.drawImage(tileSet,
          uc * TILE_SIZE, ur * TILE_SIZE, TILE_SIZE, TILE_SIZE,
          dx, dy, TILE_SIZE, TILE_SIZE);
      } else {
        drawTileFallback(ctx, tileId, dx, dy);
      }
    }
  }

  // ── Draw ship in dock ──
  const _dockScreenX = DOCK_DOOR_TX*TILE_SIZE + camOffX;
  const _dockScreenY = (DOCK_DOOR_TY-4)*TILE_SIZE + camOffY;
  if (_dockScreenX > -200 && _dockScreenX < cW+200) {
    _drawShipInDock(ctx, _dockScreenX, _dockScreenY);
  }
  // ── Draw Vael (patrol NPC — rendered separately at her patrol position)
  _drawVael(ctx, camOffX, camOffY);
  // ── Draw NPCs ──
  NPCS.forEach(npc => {
    if (npc.id === 'cleric_1') return; // drawn by _drawVael instead
    const dx = npc.tx * TILE_SIZE + camOffX;
    const dy = npc.ty * TILE_SIZE + camOffY;
    if (dx < -TILE_SIZE || dy < -TILE_SIZE || dx > cW + TILE_SIZE || dy > cH + TILE_SIZE) return;
    const npcImg = IMGS[npc.img];
    const row = DIR_ROW[npc.dir] || 0;
    if (npcImg?.complete && npcImg.naturalWidth > 0) {
      ctx.drawImage(npcImg,
        0, row * FRAME_H, FRAME_W, FRAME_H,
        dx, dy, TILE_SIZE, TILE_SIZE);
    } else {
      ctx.fillStyle = '#4488ff';
      ctx.fillRect(dx + 8, dy + 8, 16, 16);
    }
    // Interaction prompt when adjacent
    const ptx = Math.floor(S.px / TILE_SIZE), pty = Math.floor(S.py / TILE_SIZE);
    const dist = Math.abs(ptx - npc.tx) + Math.abs(pty - npc.ty);
    if (dist <= 1) {
      ctx.fillStyle = '#e8c87a';
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('✦', dx + TILE_SIZE/2, dy - 4);
    }
  });

  // -- Draw enemies
  (S.enemies||[]).forEach(e=>{
    if(!e.alive)return;
    const edx=e.tx*TILE_SIZE+camOffX,edy=e.ty*TILE_SIZE+camOffY;
    if(edx<-TILE_SIZE||edy<-TILE_SIZE||edx>cW+TILE_SIZE||edy>cH+TILE_SIZE)return;
    ctx.fillStyle=e.color||'rgba(100,20,40,0.7)';ctx.globalAlpha=0.8;
    ctx.fillRect(edx+3,edy+3,TILE_SIZE-6,TILE_SIZE-6);ctx.globalAlpha=1;
    ctx.font='13px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.fillText(e.emoji||'?',edx+TILE_SIZE/2,edy+TILE_SIZE/2);
    ctx.textBaseline='alphabetic';
    const hpF=Math.max(0,e.currentHp/e.hp);
    ctx.fillStyle='#220000';ctx.fillRect(edx+2,edy-5,TILE_SIZE-4,3);
    ctx.fillStyle=hpF>.5?'#44cc44':hpF>.25?'#ccaa00':'#cc3333';
    ctx.fillRect(edx+2,edy-5,(TILE_SIZE-4)*hpF,3);
  });

  // ── Draw player ──
  const pdx = S.px + camOffX - TILE_SIZE * 0.5;
  const pdy = S.py + camOffY - TILE_SIZE * 0.5;
  const playerImg = IMGS['player'];
  const pRow = DIR_ROW[S.dir] || 0;
  const pCol = S.moving ? S.animFrame : 0;

  if (playerImg?.complete && playerImg.naturalWidth > 0) {
    ctx.drawImage(playerImg,
      pCol * FRAME_W, pRow * FRAME_H, FRAME_W, FRAME_H,
      pdx, pdy, TILE_SIZE, TILE_SIZE);
  } else {
    // Procedural player fallback — simple coloured rectangle
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(pdx + 8, pdy + 4, 16, 22);
    ctx.fillStyle = '#ffcc88';
    ctx.fillRect(pdx + 10, pdy, 12, 12); // head
    // Direction indicator
    ctx.fillStyle = '#ffffff';
    const arrowDx = S.dir === 'left' ? -4 : S.dir === 'right' ? 4 : 0;
    const arrowDy = S.dir === 'up' ? -4 : S.dir === 'down' ? 4 : 0;
    ctx.fillRect(pdx + 16 + arrowDx, pdy + 12 + arrowDy, 3, 3);
  }

  // ── Exit zone hint ──
  const playerTy = Math.floor(S.py / TILE_SIZE);
  if (playerTy <= 2) {
    ctx.fillStyle = 'rgba(180,140,60,0.75)';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('[ Return to Ship ]', cW / 2, cH - 24);
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────
let animId = null;

function loop(timestamp) {
  animId = requestAnimationFrame(loop);

  const dt = S.lastTimestamp ? Math.min((timestamp - S.lastTimestamp) / 1000, 0.1) : 0.016;
  S.lastTimestamp = timestamp;
  S.sessionT += dt;
  if (S.interactCooldown > 0) S.interactCooldown--;
  _updateVael(dt);
  if (!S.combat.active && !NF.active) _checkNorthExit();

  // ── Input ──
  S.moving = false;
  const shopOpen=document.getElementById('surf-shop')?.style.display==='flex';
  const dlgOpen=document.getElementById('dialogue-box').style.display==='block';

  if(!dlgOpen&&!S.combat.active&&!shopOpen&&!_surfAnyOvlOpen()){
    let dx = 0, dy = 0;
    if(S.keys.left)dx-=1;if(S.keys.right)dx+=1;
    if(S.keys.up)dy-=1;if(S.keys.down)dy+=1;
    if(S.joystickActive){dx+=S.joystickX;dy+=S.joystickY;}
    const _mag=Math.sqrt(dx*dx+dy*dy);if(_mag>1){dx/=_mag;dy/=_mag;}
    const _moving=(dx!==0||dy!==0);
    if(_moving)tryMove(dx,dy,dt);
    _tickFootsteps(dt,_moving);
  }

  // ── Sprite animation ──
  if (S.moving) {
    S.animTimer += dt;
    if (S.animTimer >= 1 / ANIM_FPS) {
      S.animTimer = 0;
      S.animFrame = (S.animFrame + 1) % FRAME_COLS;
    }
  } else {
    S.animFrame  = 0;
    S.animTimer  = 0;
  }

  // ── Canvas sizing ──
  const cv = document.getElementById('surface-canvas');
  // clientWidth/Height can be 0 on first paint — use window dimensions as fallback
  const cW = cv.clientWidth  || window.innerWidth;
  const cH = cv.clientHeight || (window.innerHeight - 96);
  if (cv.width !== cW || cv.height !== cH) { cv.width = cW; cv.height = cH; }

  updateCamera(cW, cH);
  updateHUD();

  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false; // keep pixels sharp
  render(ctx, cW, cH);
}

(function(){
  const zone=document.getElementById('surf-joy-zone');
  const knob=document.getElementById('surf-joy-knob');

    zone.style.display='block';

  }
  const R=34;let _a=false,ox=0,oy=0;
  zone.addEventListener('touchstart',e=>{
    e.preventDefault();_a=true;S.joystickActive=true;
    const r=zone.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2;
    _mv(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});
  zone.addEventListener('touchmove',e=>{e.preventDefault();if(_a)_mv(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  zone.addEventListener('touchend',_rel);zone.addEventListener('touchcancel',_rel);
  function _rel(){_a=false;S.joystickActive=false;S.joystickX=0;S.joystickY=0;knob.style.transform='translate(-50%,-50%)';}
  function _mv(cx,cy){
    let dx=cx-ox,dy=cy-oy,d=Math.sqrt(dx*dx+dy*dy);
    if(d>R){dx*=R/d;dy*=R/d;}
    knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
    S.joystickX=dx/R;S.joystickY=dy/R;
  }

// ============================================================
// COMBAT SCENE RENDERER  v2  (BoF3-style side view)
// ============================================================

// ── Combat sprite sheet helpers ────────────────────────────────────────────
// Frame size for all combat sheets: 64×64 px.
// Draws one frame anchored at bottom-centre (x,y = feet on ground).
// Returns true if the image was available and drawn; false = use procedural.
const CBT_FRAME_W = 64, CBT_FRAME_H = 64;
const CBT_SCALE   = 1.5;  // render size: 96×96 screen pixels

function _cbtFrame(ctx, key, row, col, x, y) {
  const img = IMGS[key];
  if (!img || !img.complete || img.naturalWidth === 0) return false;
  // Derive actual frame size from sheet — always 4 columns wide.
  // This handles any upload resolution (256, 512, etc.) automatically.
  const srcW = Math.floor(img.naturalWidth  / 4);
  const srcH = Math.floor(img.naturalHeight / 4);
  const dw = CBT_FRAME_W * CBT_SCALE;  // always render at 96px wide
  const dh = CBT_FRAME_H * CBT_SCALE;  // always render at 96px tall
  ctx.drawImage(img,
    col * srcW, row * srcH, srcW, srcH,
    Math.floor(x - dw / 2), Math.floor(y - dh), dw, dh);
  return true;
}

// Row/col selector for the captain sprite sheet
// Row 0 = Idle, Row 1 = Melee, Row 2 = Ranged, Row 3 = Hurt/Victory
function _capRowCol() {
  const a = _cbtA;
  // Hurt (hit flash)
  if (a.capFlash > 0.05) return [3, a.capFlash > 0.2 ? 0 : 1];
  // Victory
  if (S.combat.ended && S.combat.enemy && !S.combat.enemy.alive)
    return [3, Math.floor(a.t * 4) % 2 + 2];
  // Ranged attack
  if (a.atkPhase === 'rng' || a.atkPhase === 'rng-done') {
    const col = a.atkPhase === 'rng'
      ? (a.atkT < 0.05 ? 0 : a.atkT < 0.10 ? 1 : a.atkT < 0.14 ? 2 : 3) : 3;
    return [2, col];
  }
  // Melee attack
  if (a.atkPhase === 'ml-out') return [1, a.atkT < 0.11 ? 0 : 1];
  if (a.atkPhase === 'ml-hold') return [1, 2];
  if (a.atkPhase === 'ml-in')   return [1, 3];
  // Idle cycle
  return [0, Math.floor(a.t * 4) % 4];
}

// Row/col selector for enemy sprite sheets
// Row 0 = Idle, Row 1 = Attack, Row 2 = Hit(0-1) / Death(2-3)
function _enmRowCol(enemy) {
  const a = _cbtA;
  if (!enemy || !enemy.alive) {
    // Death: hold frame 2 briefly, then 3
    return [2, a.t > 0.4 ? 3 : 2];
  }
  // Hit flash
  if (a.enmFlash > 0.05) return [2, a.enmFlash > 0.2 ? 0 : 1];
  // Attack animation
  if (a.atkPhase === 'enm-out') return [1, a.atkT < 0.07 ? 0 : 1];
  if (a.atkPhase === 'enm-in')  return [1, a.atkT < 0.09 ? 2 : 3];
  // Idle cycle
  return [0, Math.floor(a.t * 4) % 4];
}

let _cbtAnimId = null;
let _cbtLastTs = 0;
let _cbtA = {          // animation state
  t:0,
  capOffX:0, enmOffX:0,
  capFlash:0, enmFlash:0,
  atkPhase:null, atkT:0,   // attack animation phase
  dmgNums:[],              // [{x,y,val,t,col}]
  initT:0,                 // initiative countdown (seconds)
  initLines:[],
  menuCat:'attack', menuFocus:0,
  btnsOn:false,
};

function _cbtStartScene() {
  if (_cbtAnimId) return;
  const cv = document.getElementById('sc-scene');
  if (!cv) return;
  cv.width  = cv.clientWidth  || 360;
  cv.height = Math.min(Math.floor(cv.clientWidth * 0.48), 220);
  _cbtAnimId = requestAnimationFrame(_cbtSceneLoop);
}
function _cbtStopScene() {
  if (_cbtAnimId) { cancelAnimationFrame(_cbtAnimId); _cbtAnimId = null; }
}

function _cbtSceneLoop(ts) {
  _cbtAnimId = requestAnimationFrame(_cbtSceneLoop);
  const dt = Math.min((ts - (_cbtLastTs || ts)) / 1000, 0.05);
  _cbtLastTs = ts;
  _cbtA.t += dt;
  // ─ Attack animation phases ─
  if (_cbtA.atkPhase) {
    _cbtA.atkT += dt;
    const T = _cbtA.atkT;
    if (_cbtA.atkPhase === 'ml-out') {
      _cbtA.capOffX = Math.min(T / 0.22, 1) * 52;
      if (T >= 0.22) { _cbtA.enmFlash = 0.35; _cbtA.atkPhase = 'ml-hold'; }
    } else if (_cbtA.atkPhase === 'ml-hold') {
      if (T >= 0.12) { _cbtA.atkPhase = 'ml-in'; _cbtA.atkT = 0; }
    } else if (_cbtA.atkPhase === 'ml-in') {
      _cbtA.capOffX = 52 * (1 - Math.min(T / 0.18, 1));
      if (T >= 0.18) { _cbtA.capOffX = 0; _cbtA.atkPhase = null; }
    } else if (_cbtA.atkPhase === 'rng') {
      if (T >= 0.16) { _cbtA.enmFlash = 0.32; _cbtA.atkPhase = 'rng-done'; }
    } else if (_cbtA.atkPhase === 'rng-done') {
      if (T >= 0.38) _cbtA.atkPhase = null;
    } else if (_cbtA.atkPhase === 'enm-out') {
      _cbtA.enmOffX = -Math.min(T / 0.14, 1) * 28;
      if (T >= 0.14) { _cbtA.capFlash = 0.38; _cbtA.atkPhase = 'enm-in'; _cbtA.atkT = 0; }
    } else if (_cbtA.atkPhase === 'enm-in') {
      _cbtA.enmOffX = -28 * (1 - Math.min(T / 0.18, 1));
      if (T >= 0.18) { _cbtA.enmOffX = 0; _cbtA.atkPhase = null; }
    }
  }
  if (_cbtA.capFlash > 0) _cbtA.capFlash = Math.max(0, _cbtA.capFlash - dt * 2.8);
  if (_cbtA.enmFlash > 0) _cbtA.enmFlash = Math.max(0, _cbtA.enmFlash - dt * 2.8);
  _cbtA.dmgNums.forEach(n => { n.t -= dt; n.y -= 30 * dt; });
  _cbtA.dmgNums = _cbtA.dmgNums.filter(n => n.t > 0);
  if (_cbtA.initT > 0) _cbtA.initT -= dt;
  _cbtDrawScene();
}

function _cbtDrawScene() {
  const cv = document.getElementById('sc-scene'); if (!cv) return;
  const W = cv.width, H = cv.height;
  const ctx = cv.getContext('2d');

  // ─ Background ─
  const bg = ctx.createLinearGradient(0,0,W,0);
  bg.addColorStop(0,'#08031a'); bg.addColorStop(0.5,'#050210'); bg.addColorStop(1,'#120308');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Ground
  const GY = Math.floor(H * 0.74);
  const grd = ctx.createLinearGradient(0,GY,0,H);
  grd.addColorStop(0,'rgba(55,25,8,0.65)'); grd.addColorStop(1,'rgba(18,8,3,0.92)');
  ctx.fillStyle = grd; ctx.fillRect(0,GY,W,H-GY);
  ctx.strokeStyle='rgba(110,60,18,0.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,GY); ctx.lineTo(W,GY); ctx.stroke();

  // Subtle void particles
  ctx.fillStyle='rgba(100,60,180,0.1)';
  for (let i=0;i<5;i++) {
    const px=((i*139+_cbtA.t*7)%W), py=(i*61+Math.sin(_cbtA.t*0.5+i)*12)%(GY-10)+5;
    ctx.beginPath(); ctx.arc(px,py,1.2,0,Math.PI*2); ctx.fill();
  }

  // HP bars
  const cap=S.captain, e=S.combat.enemy;
  _hpBar(ctx,10,8,Math.floor(W*0.4),9,cap.hp/cap.maxHp,'#cc3333','Captain Lv'+cap.level,cap.hp+'/'+cap.maxHp);
  if (e) _hpBar(ctx,W-10-Math.floor(W*0.4),8,Math.floor(W*0.4),9,Math.max(0,e.currentHp/e.hp),'#3355aa',e.name,e.currentHp+'/'+e.hp,'right');

  // Character positions
  const capX = Math.floor(W*0.20) + _cbtA.capOffX;
  const enmX = Math.floor(W*0.78) + _cbtA.enmOffX;

  // Ranged bullet
  if (_cbtA.atkPhase==='rng' && e) {
    const p=Math.min(_cbtA.atkT/0.16,1);
    const bx=capX+(enmX-capX)*p, by=GY-Math.floor(H*0.22);
    ctx.fillStyle='#ffee88';
    ctx.beginPath(); ctx.arc(bx,by,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,230,80,0.25)';
    ctx.beginPath(); ctx.arc(bx,by,5,0,Math.PI*2); ctx.fill();
  }

  // Draw captain and enemy
  _drawCaptain(ctx,capX,GY,_cbtA.t,_cbtA.capFlash);
  if (e) _drawEnemy(ctx,enmX,GY,_cbtA.t,_cbtA.enmFlash,e);

  // Damage numbers
  _cbtA.dmgNums.forEach(n=>{
    ctx.globalAlpha=Math.min(n.t/0.25,1);
    ctx.fillStyle=n.col; ctx.font='bold 13px Courier New'; ctx.textAlign='center';
    ctx.fillText(n.val,n.x,n.y); ctx.globalAlpha=1;
  });

  // Initiative overlay
  if (_cbtA.initT>0) {
    const fi=Math.min((3-_cbtA.initT)/0.3,1);
    const fo=_cbtA.initT<0.5?_cbtA.initT/0.5:1;
    const al=Math.min(fi,fo)*0.9;
    ctx.fillStyle='rgba(2,1,8,'+al+')'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=Math.min(fi,fo);
    ctx.textAlign='center';
    ctx.fillStyle='#e8c87a'; ctx.font='bold 12px Georgia';
    ctx.fillText('INITIATIVE ROLL',W/2,H/2-38);
    _cbtA.initLines.forEach((ln,i)=>{
      ctx.fillStyle=i<2?'#c8a880':(ln.includes('YOU')?'#88ee88':'#ee7755');
      ctx.font=(i===2?'bold ':'')+'10px Courier New';
      ctx.fillText(ln,W/2,H/2-16+i*18);
    });
    ctx.globalAlpha=1;
  }
}

function _hpBar(ctx,x,y,w,h,pct,col,label,val,align) {
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=pct>0.5?col:pct>0.25?'#cc8800':'#cc2222';
  ctx.fillRect(x,y,w*Math.max(0,pct),h);
  ctx.strokeStyle='rgba(160,120,40,0.2)'; ctx.lineWidth=0.5; ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='rgba(210,180,130,0.75)'; ctx.font='12px Courier New';
  ctx.textAlign=align==='right'?'right':'left';
  ctx.fillText(label,align==='right'?x+w:x,y-2);
  ctx.textAlign=align==='right'?'left':'right';
  ctx.fillText(val,align==='right'?x:x+w,y-2);
}

// ─ Captain sprite (side-view, facing right) ─
function _drawCaptain(ctx,x,y,t,flash) {
  // Sprite sheet (if loaded)
  const [_cr,_cc]=_capRowCol();
  if (_cbtFrame(ctx,'cbt_captain',_cr,_cc,x,y)) return;
  // Procedural fallback
  const bob=Math.sin(t*2.6)*1.4;
  ctx.save(); ctx.translate(Math.floor(x),Math.floor(y+bob));
  const fl=flash>0.05, F='#ffffff';
  const skin=fl?F:'#dda870', suit=fl?F:'#2d3f5a', trim=fl?F:'#4466aa',
        boot=fl?F:'#1e2f3f', wep=fl?F:'#7a8fa0', gun=fl?F:'#5a6e7a';

  // Legs
  ctx.fillStyle=boot;
  ctx.fillRect(-6,-16,5,16); ctx.fillRect(2,-16,5,16);
  // Boot toes
  ctx.fillRect(-8,-4,7,4); ctx.fillRect(1,-4,7,4);
  // Torso
  ctx.fillStyle=suit; ctx.fillRect(-8,-34,16,18);
  // Chest stripe
  ctx.fillStyle=trim; ctx.fillRect(-2,-32,2,14);
  // Left arm
  ctx.fillStyle=suit; ctx.fillRect(-12,-32,4,14);
  // Right arm + weapon
  ctx.fillStyle=suit; ctx.fillRect(8,-32,4,12);
  const useGun=S.captain.ranged&&S.combat.shotsLeft>0;
  if (useGun) {
    ctx.fillStyle=gun;
    ctx.fillRect(11,-27,10,5); // barrel
    ctx.fillRect(12,-23,5,6); // grip
    // Muzzle flash if firing
    if (S.combat&&_cbtA.atkPhase==='rng'&&_cbtA.atkT<0.08) {
      ctx.fillStyle='#ffee55'; ctx.beginPath(); ctx.arc(22,-24,4,0,Math.PI*2); ctx.fill();
    }
  } else if (S.captain.melee) {
    ctx.fillStyle=wep; ctx.fillRect(11,-30,10,2);
    ctx.fillStyle='#aa7733'; ctx.fillRect(10,-28,4,3);
  }
  // Head
  ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(0,-40,8,0,Math.PI*2); ctx.fill();
  // Helmet
  ctx.fillStyle=fl?F:'#1e3050'; ctx.fillRect(-6,-44,12,6);
  ctx.fillStyle=fl?'#aaaaff':'#2a4a88'; ctx.fillRect(-4,-44,8,4);
  // Visor glow
  if (!fl) { ctx.fillStyle='rgba(80,120,220,0.3)'; ctx.fillRect(-4,-44,8,4); }

  ctx.restore();
}

// ─ Enemy dispatch ─
function _drawEnemy(ctx,x,y,t,flash,e) {
  const type=(e.type||'').toLowerCase();
  // Flip horizontally around x so right-facing sprites face the player (left)
  ctx.save();
  ctx.translate(x, 0);
  ctx.scale(-1, 1);
  ctx.translate(-x, 0);
  if (type==='crawler'||e.name.includes('Crawler')) _drawCrawler(ctx,x,y,t,flash);
  else if (type==='lurker'||e.name.includes('Lurker')) _drawLurker(ctx,x,y,t,flash);
  else _drawWatcher(ctx,x,y,t,flash);
  ctx.restore();
}

function _drawCrawler(ctx,x,y,t,fl) {
  const [_er,_ec]=_enmRowCol(S.combat.enemy);
  if (_cbtFrame(ctx,'cbt_crawler',_er,_ec,x,y)) return;
  const bob=Math.sin(t*3.5)*2.2;
  ctx.save(); ctx.translate(Math.floor(x),Math.floor(y+bob));
  const hit=fl>0.05, c1=hit?'#fff':'#882244', c2=hit?'#ffaaaa':'#551133';

  // 6 legs
  ctx.strokeStyle=c2; ctx.lineWidth=2;
  for (let i=0;i<3;i++) {
    const a=(i/3)*Math.PI*0.85-0.4;
    const wa=Math.sin(t*4+i)*0.18;
    ctx.beginPath(); ctx.moveTo(-10,-10);
    ctx.lineTo(-10-Math.cos(a+wa)*22,-10+Math.abs(Math.sin(a+wa))*14+4);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10,-10);
    ctx.lineTo(10+Math.cos(a-wa)*22,-10+Math.abs(Math.sin(a-wa))*14+4);
    ctx.stroke();
  }
  // Body
  ctx.fillStyle=c1;
  ctx.beginPath(); ctx.ellipse(0,-16,16,11,0,0,Math.PI*2); ctx.fill();
  // Abdomen
  ctx.fillStyle=c2;
  ctx.beginPath(); ctx.ellipse(0,-6,10,7,0,0,Math.PI*2); ctx.fill();
  // Eyes
  if (!hit) {
    ctx.fillStyle='#ff3333';
    ctx.beginPath(); ctx.arc(-6,-18,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-18,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffaaaa';
    ctx.beginPath(); ctx.arc(-5.5,-18.5,1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6.5,-18.5,1,0,Math.PI*2); ctx.fill();
  }
  // Mandibles
  ctx.strokeStyle=hit?'#fff':'#660022'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(-14,-3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8,-8); ctx.lineTo(14,-3); ctx.stroke();
  ctx.restore();
}

function _drawLurker(ctx,x,y,t,fl) {
  const [_er,_ec]=_enmRowCol(S.combat.enemy);
  if (_cbtFrame(ctx,'cbt_lurker',_er,_ec,x,y)) return;
  const shk=fl>0.05?(Math.random()-0.5)*4:0;
  ctx.save(); ctx.translate(Math.floor(x+shk),Math.floor(y));
  const hit=fl>0.05, c1=hit?'#fff':'#6a7d8e', c2=hit?'#aac':'#3e5260', c3=hit?'#fff':'#2a3d4a';

  // Body - craggy boulder shape
  ctx.fillStyle=c1;
  ctx.beginPath();
  ctx.moveTo(-28,0);
  ctx.bezierCurveTo(-30,-22,-22,-44,0,-46);
  ctx.bezierCurveTo(22,-46,30,-24,28,0);
  ctx.closePath(); ctx.fill();

  // Texture cracks
  ctx.strokeStyle=c3; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-12,-12); ctx.lineTo(-5,-26); ctx.lineTo(2,-20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10,-10); ctx.lineTo(16,-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6,-30); ctx.lineTo(4,-38); ctx.stroke();

  // Shadow belly
  ctx.fillStyle=c2;
  ctx.beginPath(); ctx.ellipse(0,-5,18,8,0,0,Math.PI); ctx.fill();

  // Eyes
  if (!hit) {
    const ep=0.8+Math.sin(t*2.2)*0.2;
    const drawEye=(ex,ey)=>{
      ctx.fillStyle='#ff8800'; ctx.beginPath(); ctx.arc(ex,ey,6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffcc44'; ctx.beginPath(); ctx.arc(ex,ey,3.5*ep,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#331100'; ctx.beginPath(); ctx.arc(ex,ey,1.5,0,Math.PI*2); ctx.fill();
      // Glow
      const gl=ctx.createRadialGradient(ex,ey,2,ex,ey,11);
      gl.addColorStop(0,'rgba(255,140,0,0.28)'); gl.addColorStop(1,'rgba(255,140,0,0)');
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(ex,ey,11,0,Math.PI*2); ctx.fill();
    };
    drawEye(-10,-26); drawEye(10,-26);
  }
  ctx.restore();
}

function _drawWatcher(ctx,x,y,t,fl) {
  const [_er,_ec]=_enmRowCol(S.combat.enemy);
  if (_cbtFrame(ctx,'cbt_watcher',_er,_ec,x,y)) return;
  const sway=Math.sin(t*1.9)*3;
  ctx.save(); ctx.translate(Math.floor(x+sway),Math.floor(y));
  const hit=fl>0.05, c1=hit?'#fff':'#6a3380', c2=hit?'#ddaaff':'#3d1a55';

  // Spindly legs
  ctx.strokeStyle=hit?'#fff':'#4a2060'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-18,-14); ctx.lineTo(-20,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(18,-14); ctx.lineTo(20,0); ctx.stroke();

  // Body
  ctx.fillStyle=c1;
  ctx.beginPath();
  ctx.moveTo(-9,0); ctx.lineTo(-7,-52); ctx.lineTo(7,-52); ctx.lineTo(9,0);
  ctx.closePath(); ctx.fill();

  // Ribbing detail
  if (!hit) {
    ctx.strokeStyle='rgba(80,30,100,0.6)'; ctx.lineWidth=1;
    for (let i=1;i<4;i++) {
      const ry=-12*i;
      ctx.beginPath(); ctx.moveTo(-7,ry); ctx.lineTo(7,ry); ctx.stroke();
    }
  }

  // Tentacle arms
  ctx.strokeStyle=hit?'#fff':'#4a2060'; ctx.lineWidth=4;
  const at=Math.sin(t*2.2)*9;
  ctx.beginPath(); ctx.moveTo(-7,-36);
  ctx.quadraticCurveTo(-28,-36+at,-24,-20+at*0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7,-36);
  ctx.quadraticCurveTo(28,-36-at,24,-20-at*0.5); ctx.stroke();

  // Head
  ctx.fillStyle=c1;
  ctx.beginPath(); ctx.ellipse(0,-60,13,11,0,0,Math.PI*2); ctx.fill();

  // Central eye
  const ep=0.75+Math.sin(t*3.1)*0.25;
  if (!hit) {
    ctx.fillStyle='#bb44ee';
    ctx.beginPath(); ctx.ellipse(0,-60,9*ep,8*ep,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ee99ff';
    ctx.beginPath(); ctx.ellipse(0,-60,4*ep,4*ep,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#110011';
    ctx.beginPath(); ctx.arc(0,-60,2,0,Math.PI*2); ctx.fill();
    const eg=ctx.createRadialGradient(0,-60,3,0,-60,18);
    eg.addColorStop(0,'rgba(180,60,240,0.38)'); eg.addColorStop(1,'rgba(180,60,240,0)');
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,-60,18,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,-60,10,9,0,0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

// ─ Damage number helper ─
function _cbtDmg(x,y,val,col) {
  _cbtA.dmgNums.push({x,y,val:String(val),t:0.9,col:col||'#dd8855'});
}

// ─ Initiative roll ─
function _cbtRollInit(enemy) {
  const capMod=Math.floor((S.captain.level-1)/4)+(S.captain.initiative||0);
  const enmMod=enemy.initiative||0;
  const cr=Math.floor(Math.random()*20)+1;
  const er=Math.floor(Math.random()*20)+1;
  const ct=cr+capMod, et=er+enmMod;
  const first=ct>=et;
  _cbtA.initT=3.2;
  _cbtA.initLines=[
    'Captain: d20('+cr+') + '+capMod+' = '+ct,
    'Enemy:   d20('+er+') + '+enmMod+' = '+et,
    first?'-- YOU GO FIRST --':'-- ENEMY STRIKES FIRST --',
  ];
  return {first,ct,et};
}

// ─ Menu ─
function cbtMenuCat(cat) {
  // Allow tab switching at any time — only action buttons are gated by btnsOn
  if (cat !== 'dummy' && S.combat.ended) return;
  _cbtA.menuCat = cat; _cbtA.menuFocus = 0;
  document.querySelectorAll('.sc-cat').forEach(b=>b.classList.remove('active'));
  const cb = document.getElementById('sc-cat-'+cat);
  if (cb) cb.classList.add('active');
  _cbtBuildSub();
}

function _cbtBuildSub() {
  const sub=document.getElementById('sc-menu-sub'); if (!sub) return;
  sub.innerHTML='';
  if (_cbtA.menuCat==='attack') {
    const items=[];
    if (S.captain.melee)  items.push({label:'Combat Knife',hint:S.captain.melee.dmgMin+'-'+S.captain.melee.dmgMax+' dmg',fn:cbtMelee,dis:false});
    if (S.captain.ranged) {
      if (S.combat.shotsLeft > 0) {
        items.push({label:'Void Pistol',
          hint:S.captain.ranged.dmgMin+'-'+S.captain.ranged.dmgMax+' dmg | '+S.combat.shotsLeft+' shots',
          fn:cbtRanged, dis:false});
      } else {
        const _mags=S.captain.inv.filter(i=>i.id==='pistol_mag').reduce((s,i)=>s+(i.qty||1),0);
        items.push({label:_mags>0?'Reload Pistol':'Pistol Empty',
          hint:_mags>0?'uses 1 mag | '+_mags+' left':'buy ammo from Mira Voss',
          fn:_mags>0?cbtReload:()=>{}, dis:_mags<=0});
      }
    }
    items.forEach((it,i)=>{
      const b=document.createElement('button');
      b.className='sc-sub'+(i===_cbtA.menuFocus?' focused':'');
      b.innerHTML=it.label+'<span class="sc-sub-hint">'+it.hint+'</span>';
      b.disabled=it.dis||!_cbtA.btnsOn;
      b.onclick=it.fn; b.ontouchend=e=>{e.preventDefault();it.fn();};
      sub.appendChild(b);
    });
  } else if (_cbtA.menuCat==='item') {
    const potQty=S.captain.inv.filter(i=>i.id==='potion').reduce((s,i)=>s+(i.qty||1),0);
    if (potQty>0) {
      const b=document.createElement('button');
      b.className='sc-sub'+(0===_cbtA.menuFocus?' focused':'');
      b.innerHTML='Healing Tincture<span class="sc-sub-hint">+20 HP | '+potQty+' left</span>';
      b.disabled=!_cbtA.btnsOn;
      b.onclick=cbtPotion; b.ontouchend=e=>{e.preventDefault();cbtPotion();};
      sub.appendChild(b);
    } else {
      sub.innerHTML='<div style="padding:8px 14px;font-size:10px;color:#443322;font-style:italic;">No items</div>';
    }
  }
}

function _cbtSetBtns(on) {
  _cbtA.btnsOn=on;
  document.querySelectorAll('.sc-cat:not(.sc-cat-flee)').forEach(b=>{b.disabled=!on;});
  if (on) _cbtBuildSub();
  else document.querySelectorAll('.sc-sub').forEach(b=>{b.disabled=true;});
}

// ─ Keyboard nav ─
function _cbtKeyNav(e) {
  if (!S.combat.active||!_cbtA.btnsOn) return;
  const subs=[...document.querySelectorAll('.sc-sub:not(:disabled)')];
  const n=subs.length;
  if (e.key==='ArrowDown'||e.key==='s'||e.key==='S') {
    e.preventDefault(); _cbtA.menuFocus=(_cbtA.menuFocus+1)%Math.max(1,n); _cbtBuildSub();
  } else if (e.key==='ArrowUp'||e.key==='w'||e.key==='W') {
    e.preventDefault(); _cbtA.menuFocus=(_cbtA.menuFocus-1+Math.max(1,n))%Math.max(1,n); _cbtBuildSub();
  } else if (e.key==='Tab') {
    e.preventDefault(); cbtMenuCat(_cbtA.menuCat==='attack'?'item':'attack');
  } else if (e.key==='Enter'||e.key===' ') {
    e.preventDefault(); if (n>0) subs[Math.min(_cbtA.menuFocus,n-1)]?.click();
  }
}

// ╔═════════════════════════════════════════════════════════════════════╗
// ║  SURFACE COMBAT SYSTEM                                                    ║
// ╚═════════════════════════════════════════════════════════════════════╝

function _rng(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// ── Starter gear ───────────────────────────────────────────────────────────
function initStarterGear() {
  if (S.captain.gearGiven) return;
  S.captain.maxHp   = 30 + (S.captain.armor.hpBonus||0) + (S.captain.helmet.hpBonus||0);
  S.captain.hp      = S.captain.maxHp;
  S.captain.defense = (S.captain.armor.def||0) + (S.captain.helmet.def||0);
  S.captain.inv.push({ id:'potion',     name:'Healing Tincture', type:'potion', qty:2, heal:20 });
  S.captain.inv.push({ id:'pistol_mag', name:'Pistol Magazine',  type:'ammo',   qty:2, shots:3 });
  S.captain.shotsLoaded = 3;
  S.captain.gearGiven = true;
  setStatus('Gear equipped: Leather Armor, Void Helmet, Combat Knife, Void Pistol, 2x Healing Tincture.');
}

// ── Enemy spawning ────────────────────────────────────────────────────────
function initEnemies() {
  S.enemies = ENEMY_SPAWNS.map((sp, i) => ({
    ...ENEMY_DEFS[sp.type],
    tx: sp.tx, ty: sp.ty,
    currentHp: ENEMY_DEFS[sp.type].hp,
    alive: true, spawnIdx: i, type: sp.type,
  }));
}

function respawnEnemies() {
  ENEMY_SPAWNS.forEach((sp, i) => {
    if (!S.enemies[i]?.alive) {
      S.enemies[i] = {
        ...ENEMY_DEFS[sp.type],
        tx: sp.tx, ty: sp.ty,
        currentHp: ENEMY_DEFS[sp.type].hp,
        alive: true, spawnIdx: i, type: sp.type,
      };
    }
  });
}

// ── Combat open/close ────────────────────────────────────────────────────
function startCombat(idx) {
  if (S.combat.active) return;
  const e = S.enemies[idx]; if (!e?.alive) return;
  S.combat.active=true; S.combat.enemy=e; S.combat.enemyIdx=idx;
  S.combat.log=[]; S.combat.playerTurn=true;
  S.combat.shotsLeft=S.captain.ranged.shotsPerCombat||3;
  S.combat.ended=false;
  // Reset animation
  _lastAttackT = 0;
  Object.assign(_cbtA,{t:0,capOffX:0,enmOffX:0,capFlash:0,enmFlash:0,
    atkPhase:null,atkT:0,dmgNums:[],menuCat:'attack',menuFocus:0,btnsOn:false});
  // Show overlay + size canvas
  document.getElementById('surf-combat').style.display='flex';
  startCombatMusic();
  const cv=document.getElementById('sc-scene');
  if (cv){cv.width=cv.clientWidth||360;cv.height=Math.min(Math.floor(cv.clientWidth*0.48),220);}
  // Build disabled menu
  cbtMenuCat('dummy');
  _cbtBuildSub();
  // Start scene loop
  _cbtStartScene();
  // Initiative roll
  const init=_cbtRollInit(e);
  // After reveal delay, start combat proper
  setTimeout(()=>{
    _cbtA.initT=0;
    cbtLog('A '+e.name+' blocks your path!','warn');
    if (init.first) {
      cbtLog('You have initiative! Choose your action.','info');
      _cbtSetBtns(true);
    } else {
      cbtLog('The enemy moves first!','warn');
      setTimeout(_cbtEnemyTurn,600);
    }
  },3400);
}

function closeCombat() {
  S.captain.shotsLoaded = S.combat.shotsLeft;
  S.combat.active = false; S.combat.ended = false;
  stopCombatMusic();  // reset so NF loop unfreezes after combat
  _cbtStopScene();
  _ambientDuck(false);
  document.getElementById('surf-combat').style.display='none';
}

// ── UI ───────────────────────────────────────────────────────────────────────
function _renderCbt() {
  // Scene rendered by canvas loop; just update log
  const logEl=document.getElementById('sc-log'); if(!logEl) return;
  logEl.innerHTML=S.combat.log.slice(-12).map(l=>'<div class="sc-log-'+l.t+'">'+l.m+'</div>').join('');
  logEl.scrollTop=logEl.scrollHeight;
  _cbtBuildSub(); // refresh counts
}

function cbtLog(msg, t) {
  S.combat.log.push({ m: msg, t: t || 'info' });
  _renderCbt();
}

function _setCbtBtns(on) { _cbtSetBtns(on); }


// ── Player actions ─────────────────────────────────────────────────────────
function _doPlayerAttack(wep) {
  const e=S.combat.enemy;
  if(wep.type==='ranged'){sfx('pistol_shot',0.9);}else{sfx('knife_swing',0.7);setTimeout(()=>sfx('knife_hit',0.8),260);}
  const dmg=Math.max(1,_rng(wep.dmgMin,wep.dmgMax)-(e.def||0));
  e.currentHp=Math.max(0,e.currentHp-dmg);
  // Trigger animation
  const cv=document.getElementById('sc-scene');
  const W=cv?cv.width:360, H=cv?cv.height:180;
  const enmX=Math.floor(W*0.78);
  _cbtA.atkPhase=wep.type==='ranged'?'rng':'ml-out'; _cbtA.atkT=0;
  const delay=wep.type==='ranged'?160:260;
  setTimeout(()=>_cbtDmg(enmX,Math.floor(H*0.18),'-'+dmg,'#ee7744'),delay);
  cbtLog('You strike with '+wep.name+' — '+dmg+' damage! (Enemy: '+e.currentHp+'/'+e.hp+')','hit');
  if (e.currentHp<=0) { setTimeout(cbtWin,850); return; }
  _cbtSetBtns(false);
  setTimeout(_cbtEnemyTurn,900);
}

let _lastAttackT = 0;
function cbtMelee() {
  if (!S.combat.playerTurn || S.combat.ended || !_cbtA.btnsOn) return;
  const _n=Date.now(); if(_n-_lastAttackT<400)return; _lastAttackT=_n;
  _doPlayerAttack(S.captain.melee);
}

function cbtRanged() {
  if (!S.combat.playerTurn || S.combat.ended || !_cbtA.btnsOn) return;
  const _nr=Date.now(); if(_nr-_lastAttackT<400)return; _lastAttackT=_nr;
  if (S.combat.shotsLeft <= 0) { cbtLog('Out of shots!', 'warn'); return; }
  S.combat.shotsLeft--;
  _doPlayerAttack(S.captain.ranged);
}

function cbtPotion() {
  if (!S.combat.playerTurn || S.combat.ended) return;
  const _np=Date.now(); if(_np-_lastAttackT<400)return; _lastAttackT=_np;
  const slot = S.captain.inv.find(i => i.id === 'potion' && (i.qty||1) > 0);
  if (!slot) { cbtLog('No potions left!', 'warn'); return; }
  slot.qty = (slot.qty||1) - 1;
  if (slot.qty <= 0) S.captain.inv = S.captain.inv.filter(i => i !== slot);
  const heal = slot.heal || 20;
  S.captain.hp = Math.min(S.captain.maxHp, S.captain.hp + heal);
  cbtLog('Healing Tincture: +' + heal + ' HP. (' + S.captain.hp + '/' + S.captain.maxHp + ')', 'good');
  _setCbtBtns(false);
  setTimeout(_cbtEnemyTurn, 700);
}

function cbtReload() {
  if (!S.combat.playerTurn || S.combat.ended) return;
  if (S.combat.shotsLeft >= 3) { cbtLog('Pistol fully loaded.','info'); return; }
  const slot = S.captain.inv.find(i=>i.id==='pistol_mag'&&(i.qty||1)>0);
  if (!slot) { cbtLog('No magazines! Buy some from Mira Voss.','warn'); return; }
  slot.qty=(slot.qty||1)-1;
  if(slot.qty<=0) S.captain.inv=S.captain.inv.filter(i=>i!==slot);
  S.combat.shotsLeft=3;
  sfx('reload',0.85);
  cbtLog('You reload the Void Pistol — 3 shots ready.','good');
  _setCbtBtns(false);
  setTimeout(_cbtEnemyTurn, 700);
}

function cbtFlee() {
  if (S.combat.ended) return;
  if (Math.random() < 0.5) {
    cbtLog('You slip away into the shadows!', 'good');
    S.combat.ended = true;
    setTimeout(() => {
      closeCombat();
      // If fleeing from Northern Field — push player 8 tiles south
      // and give the enemy a long alert cooldown so they don't immediately
      // re-engage when the NF loop resumes
      if (NF.active) {
        const e = S.combat.enemy?._nfRef;
        if (e) {
          e.alerted = false;
          e.alertCooldown = 8.0;  // 8 seconds before they can see you again
        }
        // Move player 8 tiles south (away from enemy)
        NF.py = Math.min((NF_H - 3) * NF_TILE, NF.py + 8 * NF_TILE);
        NF.px = NF.px;  // keep horizontal position
      } else {
        // Village/normal map — push south
        S.py = Math.min((MAP_H - 2) * TILE_SIZE, S.py + 8 * TILE_SIZE);
      }
      setStatus('You fled to safety.');
    }, 800);
  } else {
    cbtLog('Flee failed! The enemy strikes as you turn.', 'warn');
    _setCbtBtns(false);
    setTimeout(_cbtEnemyTurn, 500);
  }
}

// ── Enemy turn ────────────────────────────────────────────────────────────
function _cbtEnemyTurn() {
  if (S.combat.ended) return;
  const e=S.combat.enemy;
  sfxEnemyAtk(e.type||'');
  const dmg=Math.max(1,_rng(e.atk[0],e.atk[1])-S.captain.defense);
  S.captain.hp=Math.max(0,S.captain.hp-dmg);
  setTimeout(()=>sfx('player_hurt',0.75),200);
  // Trigger animation
  const cv=document.getElementById('sc-scene');
  const W=cv?cv.width:360, H=cv?cv.height:180;
  const capX=Math.floor(W*0.20);
  _cbtA.atkPhase='enm-out'; _cbtA.atkT=0;
  setTimeout(()=>_cbtDmg(capX,Math.floor(H*0.18),'-'+dmg,'#cc3333'),150);
  cbtLog(e.name+' attacks for '+dmg+' damage! (Your HP: '+S.captain.hp+'/'+S.captain.maxHp+')','hit');
  if (S.captain.hp<=0) { setTimeout(cbtDefeat,700); return; }
  setTimeout(()=>{ S.combat.playerTurn=true; _cbtSetBtns(true); },560);
}


// ── Outcomes ──────────────────────────────────────────────────────────────
function cbtWin() {
  if (S.combat.ended) return;
  S.combat.ended = true;
  const e = S.combat.enemy;
  e.alive = false;
  // Track NF kill and quest progress if this was a Northern Field enemy
  if (e._nfRef) {
    e._nfRef.alive = false;
    e._nfRef.currentHp = 0;
    _questTrackKill(e.type);
  }
  const xpGain = e.xp;
  S.captain.xp += xpGain;
  sfx('enemy_die',0.9);
  cbtLog('Victory! +' + xpGain + ' XP (' + S.captain.xp + '/' + xpToNext(S.captain.level) + ')', 'good');
  // Level-up loop
  let leveled = false;
  while (S.captain.xp >= xpToNext(S.captain.level)) {
    S.captain.xp -= xpToNext(S.captain.level);
    S.captain.level++;
    S.captain.maxHp += 5;
    S.captain.hp = S.captain.maxHp;
    leveled = true;
    sfx('level_up',1.0);
    cbtLog('LEVEL UP! Captain is now Level ' + S.captain.level + '! Max HP: ' + S.captain.maxHp, 'good');
  }
  // Loot rolls
  (e.loot||[]).forEach(l => {
    if (Math.random() < l.p) {
      const ex = S.captain.inv.find(i => i.id === l.id);
      if (ex) ex.qty = (ex.qty||1)+1;
      else S.captain.inv.push({ id:l.id, name:l.name, type:'component', qty:1 });
      cbtLog('Salvaged: ' + l.name, 'good');
    }
  });
  _setCbtBtns(false);
  setStatus('Defeated ' + e.name + '. +' + xpGain + ' XP');
  if (leveled) cbtLog('*** LEVEL UP! Captain is now Level ' + S.captain.level + '! ***', 'good');
  cbtLog(leveled ? 'Victory! Level up!' : 'Victory!', 'good');
  setTimeout(closeCombat, 2000);
}

// Clinic spawn point — just inside the door of Sister Vael's building
const CLINIC_SPAWN_TX = 23, CLINIC_SPAWN_TY = 12;  // inside chapel

function cbtDefeat() {
  if (S.combat.ended) return;
  S.combat.ended = true;
  // Reset quest tier — a tougher group drove the enemy back and crawlers moved in
  if ((S.nfQuestTier||0) > 0) {
    S.nfQuestTier = 0;
    S.quest.active = false;
    S.quest.killed = 0;
  }
  sfx('player_down', 0.85);
  cbtLog('Everything goes dark…', 'warn');
  _setCbtBtns(false);
  // Kill NF immediately — any delay lets _nfLoop call closeNorthernField()
  // which repositions S.px/py before _transportToClinic runs.
  if (NF.active) _closeNFSilent();
  setTimeout(() => {
    closeCombat();
    _transportToClinic();
  }, 2000);
}

// Clinic transport with gold penalty
function _transportToClinic() {
  // ── 10% TS penalty ─────────────────────────────────────────────────────
  const tsPenalty = Math.ceil(S.gold * 0.10);
  S.gold = Math.max(0, S.gold - tsPenalty);
  // ── Small XP penalty (10% of XP toward next level, min 0) ─────────────
  const xpPenalty = Math.ceil((S.captain.xp || 0) * 0.10);
  S.captain.xp = Math.max(0, (S.captain.xp || 0) - xpPenalty);
  // ── Reset HP to 1 ──────────────────────────────────────────────────────
  S.captain.hp = 1;

  // Move player IMMEDIATELY so _checkNorthExit can't see ty=0 and reopen NF
  S.px = CLINIC_SPAWN_TX * TILE_SIZE;
  S.py = CLINIC_SPAWN_TY * TILE_SIZE;
  S.dir = 'down';
  const ov = document.getElementById('transition-overlay');
  if (ov) { ov.style.opacity='1'; ov.style.transition='opacity 0.4s'; }
  setTimeout(() => {
    if (ov) { ov.style.transition='opacity 0.6s'; setTimeout(()=>{ ov.style.opacity='0'; },50); }
    const lostMsg = tsPenalty > 0
      ? 'Lost '+tsPenalty+' TS and '+xpPenalty+' XP.'
      : '';
    setStatus('You wake in Sister Vael’s clinic, barely alive. '+lostMsg);
    updateHUD();
    setTimeout(() => {
      const cleric = NPCS.find(n => n.id === 'cleric_1');
      if (cleric) openDlg(cleric);
    }, 900);
  }, 450);
}

  _surfSellFlt = 'all';
  document.querySelectorAll('.surf-sflt').forEach((b,i) => b.classList.toggle('active', i===0));
  _surfBuildShopGrid();
}
function surfSellFilter(f, btn) {
  _surfSellFlt = f;
  document.querySelectorAll('.surf-sflt').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  _surfBuildShopGrid();
}

function _surfBuildShopGrid() {
  const grid = document.getElementById('surf-shop-grid'); if (!grid) return;
  const msg  = document.getElementById('surf-shop-msg');
  const tsEl = document.getElementById('surf-shop-ts');
  if (tsEl) tsEl.textContent = S.gold + ' TS';
  grid.innerHTML = '';

  const stock = SHOP_STOCK[_shopNpc?.shopId];
  if (!stock) return;

  if (_shopTab === 'buy') {
    // ── Buy tab: show what this merchant sells ────────────────────
    if (!stock.sells?.length) {
      _mkShopEmpty(grid, 'This merchant buys only — nothing for sale here.');
      if (msg) msg.textContent = '';
      return;
    }
    stock.sells.forEach(id => {
      const def = ITEM_DEFS[id]; if (!def?.buyVal) return;
      const canAfford = S.gold >= def.buyVal;
      const sub = def.type === 'potion'  ? 'Restores 20 HP'
                : def.type === 'ammo'    ? '3 shots per magazine'
                : def.desc || '';
      const d = _mkShopCard(def.ico || '📦', def.name, sub, def.buyVal + ' TS', false, !canAfford);
      if (canAfford) d.onclick = () => _surfShopBuy(id);
      grid.appendChild(d);
    });
    if (msg) msg.textContent = 'You have ' + S.gold + ' TS.';

  } else {
    // ── Sell tab: show captain inventory filtered ─────────────────
    const mult = stock.sellMult || 1;
    const SELL_TYPES = { trade:true, component:true, artifact:true, usable:true,
                         material:true, ammo:true, equip:true };
    const all = S.captain.inv.filter(item => {
      const def = _surfItemDef(item);
      return SELL_TYPES[def.type] && (def.val || item.val || 0) > 0;
    });
    const filtered = all.filter(item => {
      if (_surfSellFlt === 'all') return true;
      return _surfItemDef(item).type === _surfSellFlt;
    });

    if (!filtered.length) {
      _mkShopEmpty(grid, 'Nothing to sell' + (_surfSellFlt !== 'all' ? ' in this category.' : '.'));
      if (msg) msg.textContent = '';
      return;
    }

    // Sell All button
    if (filtered.length > 1) {
      const totalVal = filtered.reduce((a, item) => {
        const def = _surfItemDef(item);
        return a + Math.floor((def.val || item.val || 0) * (item.qty || 1) * mult);
      }, 0);
      const allCard = _mkShopCard('💰', 'Sell All (' + filtered.length + ' items)', '', totalVal + ' TS', true, false);
      allCard.classList.add('sell-all');
      allCard.onclick = () => {
        filtered.forEach(item => { S.captain.inv = S.captain.inv.filter(i => i !== item); });
        S.gold += totalVal;
        sfx('sell', 0.8);
        _shopMsg('Sold ' + filtered.length + ' items for ' + totalVal + ' TS.');
        _surfBuildShopGrid();
      };
      grid.appendChild(allCard);
    }

    filtered.forEach(item => {
      const def   = _surfItemDef(item);
      const qty   = item.qty || 1;
      const price = Math.floor((def.val || item.val || 0) * mult);
      const name  = def.n + (qty > 1 ? ' ×' + qty : '');
      const sub   = def.desc ? def.desc.slice(0, 45) + (def.desc.length > 45 ? '…' : '') : def.type;
      const priceStr = price + (qty > 1 ? ' ea' : '') + ' TS' + (mult > 1 ? ' ★' : '');
      const d = _mkShopCard(def.ico || '📦', name, sub, priceStr, true, false);
      d.onclick = () => {
        item.qty = (item.qty || 1) - 1;
        if (item.qty <= 0) S.captain.inv = S.captain.inv.filter(i => i !== item);
        S.gold += price;
        sfx('sell', 0.7);
        _shopMsg('Sold ' + def.n + ' for ' + price + ' TS' + (mult > 1 ? ' (premium!)' : '') + '.');
        _surfBuildShopGrid();
        surfBuildInvGrid(); // keep cargo overlay in sync
      };
      grid.appendChild(d);
    });
    if (msg) msg.textContent = 'You have ' + S.gold + ' TS. ' + (mult > 1 ? '★ Premium buyer — ' + Math.round((mult-1)*100) + '% bonus.' : '');
  }
}

function _mkShopCard(ico, name, desc, costStr, isSell, disabled) {
  const d = document.createElement('div');
  d.className = 'ssurf-item' + (disabled ? ' dis' : '');
  d.innerHTML = '<div class="ssurf-name">' + ico + ' ' + name + '</div>'
    + '<div class="ssurf-desc">' + desc + '</div>'
    + '<div class="' + (isSell ? 'ssurf-sell' : 'ssurf-cost') + '">' + costStr + '</div>';
  return d;
}
function _mkShopEmpty(grid, text) {
  const d = document.createElement('div');
  d.style.cssText = 'color:#9977aa;font-style:italic;font-size:13px;grid-column:1/-1;text-align:center;padding:20px;';
  d.textContent = text;
  grid.appendChild(d);
}
function _surfShopBuy(id) {
  const def = ITEM_DEFS[id]; if (!def?.buyVal) return;
  if (S.gold < def.buyVal) { _shopMsg('Not enough TS.'); return; }
  S.gold -= def.buyVal;
  const ex = S.captain.inv.find(i => i.id === id);
  if (ex) ex.qty = (ex.qty||1)+1;
  else S.captain.inv.push({ id, name:def.name, type:def.type, qty:1,
    ...(def.heal  ? {heal:def.heal}  : {}),
    ...(def.shots ? {shots:def.shots}: {}) });
  sfx('purchase', 0.75);
  _shopMsg('Bought: ' + def.name + ' (−' + def.buyVal + ' TS)');
  _surfBuildShopGrid();
}
function _shopMsg(t) {
  const el = document.getElementById('surf-shop-msg'); if (el) el.textContent = t;
}

    +(cap.helmet ? '<div class="srow"><span class="slabel">Helmet</span><span class="sval">'+cap.helmet.name+' +'+cap.helmet.hpBonus+' HP</span></div>' : '')
    +(cap.melee  ? '<div class="srow"><span class="slabel">Melee</span><span class="sval">'+cap.melee.name+' '+cap.melee.dmgMin+'-'+cap.melee.dmgMax+'dmg</span></div>' : '')
    +(cap.ranged ? '<div class="srow"><span class="slabel">Ranged</span><span class="sval">'+cap.ranged.name+' '+cap.ranged.dmgMin+'-'+cap.ranged.dmgMax+'dmg</span></div>' : '')
